<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3125A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Alarmstufe Pink">
<title>Alarmstufe Pink</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Basis wie H&E Hub, Farben: Feuerwehrrot, Tannengrün, Gold */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#EBEDF2; --ink:#14161C; --muted:#646B7A; --line:#E2E5EB;
  --accent:#2E5BFF; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --c-car:#2E5BFF; --c-car-soft:#E6ECFF; --c-cal:#0E9F8E; --c-cal-soft:#DDF4F1; --c-bill:#E86A2C; --c-bill-soft:#FDEBDF; --c-bin:#5B6B2E; --c-bin-soft:#ECF0DD; --c-bday:#D63F7A; --c-bday-soft:#FCE3EE; --c-fix:#6A4CC7; --c-fix-soft:#EEE9FB;
  --ok:#14874F; --ok-soft:#DCF3E7; --warn:#B26A00; --warn-soft:#FCEED6; --crit:#D02B36; --crit-soft:#FCE1E3;
  --shadow:0 1px 2px rgba(20,22,28,.04),0 8px 24px rgba(20,22,28,.06);
  --shadow-hi:0 2px 4px rgba(20,22,28,.06),0 18px 40px rgba(20,22,28,.10);
  --plate:#FFFFFF; --plate-ink:#111111; --plate-eu:#1E47C8;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-lg:22px;
  --logo-a:#5B82FF; --logo-b:#2E5BFF; --logo-c:#1631A8; --logo-amp:#FFD27A; --logo-glow:rgba(46,91,255,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#171A21; --sunken:#1F232C; --ink:#EEF0F4; --muted:#9AA1B0; --line:#262B35;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2540;
  --c-car:#7C9BFF; --c-car-soft:#1D2540; --c-cal:#3FD3BF; --c-cal-soft:#123331; --c-bill:#FF9A63; --c-bill-soft:#3A2418; --c-bin:#B9CC7A; --c-bin-soft:#262C17; --c-bday:#FF7FB0; --c-bday-soft:#3A1828; --c-fix:#AE98FF; --c-fix-soft:#261E40;
  --ok:#4CD38C; --ok-soft:#13301F; --warn:#F2B24F; --warn-soft:#352812; --crit:#FF6B75; --crit-soft:#3A181C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);
  --plate:#F1F1EE; --plate-ink:#111111; --plate-eu:#2450D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#171A21; --sunken:#1F232C; --ink:#EEF0F4; --muted:#9AA1B0; --line:#262B35;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2540;
  --c-car:#7C9BFF; --c-car-soft:#1D2540; --c-cal:#3FD3BF; --c-cal-soft:#123331; --c-bill:#FF9A63; --c-bill-soft:#3A2418; --c-bin:#B9CC7A; --c-bin-soft:#262C17; --c-bday:#FF7FB0; --c-bday-soft:#3A1828; --c-fix:#AE98FF; --c-fix-soft:#261E40;
  --ok:#4CD38C; --ok-soft:#13301F; --warn:#F2B24F; --warn-soft:#352812; --crit:#FF6B75; --crit-soft:#3A181C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);
  --plate:#F1F1EE; --plate-ink:#111111; --plate-eu:#2450D0; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{overflow-x:hidden;max-width:100%}
@media (max-width:600px){
  .table-wrap{overflow:visible;background:none;border:none;box-shadow:none}
  .table-wrap table{min-width:0}
  .table-wrap thead{display:none}
  .table-wrap tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .table-wrap td{display:block;padding:0;border:none;background:none!important}
  .table-wrap tbody td:nth-child(1){grid-column:1;grid-row:1/4}
  .table-wrap tbody td:nth-child(2){grid-column:2;grid-row:1;font-size:.8rem;color:var(--muted)}
  .table-wrap tbody td:nth-child(3){grid-column:2;grid-row:2}
  .table-wrap tbody td:nth-child(4){grid-column:2;grid-row:3}
  .table-wrap tbody td:nth-child(5){grid-column:3;grid-row:2;font-size:.78rem;color:var(--muted)}
  .table-wrap tbody td:nth-child(6){grid-column:3;grid-row:1;font-weight:800}
  .table-wrap tbody td:nth-child(7){grid-column:1/-1;grid-row:4;text-align:left!important;white-space:normal!important}
  .table-wrap tfoot tr{grid-template-columns:1fr auto auto;background:var(--sunken)}
  .table-wrap td:empty{display:none}
  .row .acts,.toolbar{gap:6px}
  .row .acts button,.toolbar button{min-height:38px;padding:6px 12px}
  .view-head .btn,.view-head button{min-height:40px;padding:8px 14px}
  .page-title{font-size:1.45rem}
  .sheet{padding:18px}
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.1rem;font-weight:700}
.page-title{font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em}
.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button,.btn{font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:42px;transition:background .15s,border-color .15s,transform .1s}
button:hover,.btn:hover{border-color:var(--muted)}
button:active,.btn:active{transform:scale(.97)}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.primary:hover{border-color:var(--ink);opacity:.9}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ghost:hover{background:var(--sunken);border-color:transparent;color:var(--ink)}
.danger{color:var(--crit)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}

header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:nowrap}
header.top .brand{min-width:0;flex:1 1 auto}
header.top .toolbar{flex:none}
@media (max-width:420px){header.top .logo{width:44px;height:44px;border-radius:14px}header.top .wordmark{font-size:1.35rem}header.top .eyebrow{font-size:.62rem;letter-spacing:.06em}}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;background:#000;border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.logo .mono{color:#fff;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;line-height:1}
.logo .amp{font-weight:600;margin:0 .04em}
.wordmark{display:flex;align-items:baseline;font-weight:800;letter-spacing:-.02em;font-size:1.6rem;line-height:1}
.wordmark .amp{font-weight:600;margin:0 .06em}
.wordmark .hub{font-weight:400;color:var(--muted);margin-left:.28em;letter-spacing:-.01em}
.status{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.hello{display:grid;gap:4px}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
.t2{position:relative;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:var(--shadow);min-width:0;min-height:128px;transition:transform .15s,box-shadow .15s}
.t2:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.t2:active{transform:scale(.98)}
.t2-top{display:flex;align-items:center;gap:8px;min-width:0}
.t2 .chip{width:34px;height:34px;border-radius:11px;flex:none}
.t2 .chip svg.i{width:18px;height:18px}
.t2-title{font-weight:800;font-size:.92rem;letter-spacing:-.01em;line-height:1.15;min-width:0;overflow-wrap:normal;word-break:normal;-webkit-hyphens:auto;hyphens:auto}
.t2-main,.t2-sub{overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
@media (max-width:380px){.t2 .chip{width:30px;height:30px}.t2-top{gap:7px}}
.t2-body{display:grid;align-content:end;gap:2px;min-width:0}
.t2-main{font-weight:700;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
.t2-main.num{font-size:1.25rem}
.t2-sub{font-size:.8rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.t2-dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:transparent}
.t2-dot.ok{background:var(--ok)}
.t2-dot.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.t2-dot.crit{background:var(--crit);box-shadow:0 0 0 4px var(--crit-soft)}
.t2-share{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:3px;min-height:0;padding:3px 7px;border:none;border-radius:999px;background:var(--sunken);color:var(--muted);font-size:.68rem;font-weight:700}
.t2-share svg.i{width:12px;height:12px}
.t2-share:hover{border:none;color:var(--ink)}
.t2.has-share .t2-sub{padding-right:30px}
.t2.warn{border-color:var(--warn)}
.t2.crit{border-color:var(--crit)}
.homebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.homebar button{pointer-events:auto;min-height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);border:none;font-size:.95rem;box-shadow:var(--shadow-hi);gap:10px}
.homebar button.on{opacity:.92}
.homebar button:hover{border:none;opacity:.9}
.homebar svg.i{width:22px;height:22px}
.brand{cursor:pointer;border:none;background:none;padding:0;color:inherit;font:inherit;text-align:left;min-height:0}
.brand:hover{border:none}
.menu-btn{width:44px;height:44px;padding:0;border-radius:14px}
.menu-list{display:grid;gap:8px}
.menu-list button{justify-content:flex-start;border-radius:14px;min-height:50px;background:var(--sunken);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:18px;cursor:pointer;min-width:0;text-align:left;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.tile:hover{box-shadow:var(--shadow-hi);transform:translateY(-3px)}
.tile-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile-title{display:flex;align-items:center;gap:12px}
.chip{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.chip.car{background:var(--c-car-soft);color:var(--c-car)}
.chip.cal{background:var(--c-cal-soft);color:var(--c-cal)}
.chip.bill{background:var(--c-bill-soft);color:var(--c-bill)}
.chip.bin{background:var(--c-bin-soft);color:var(--c-bin)}
.chip.bday{background:var(--c-bday-soft);color:var(--c-bday)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3 input,.row2 input{padding-left:8px;padding-right:8px}
.chip.hours{background:var(--c-bill-soft);color:var(--c-bill)}
.chip.food{background:var(--c-cal-soft);color:var(--c-cal)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week-nav b{text-align:center;flex:1}
.meal-day{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.meal-day.today{border-color:var(--c-cal);box-shadow:0 0 0 2px var(--c-cal-soft)}
.meal-day.past{opacity:.6}
.meal-day .wd{font-weight:800;font-size:.9rem;line-height:1.2}
.meal-day .wd span{display:block;color:var(--muted);font-weight:600;font-size:.75rem}
.meal-slots{display:grid;gap:6px;min-width:0}
.meal{display:flex;gap:8px;align-items:center;min-width:0;border:none;background:var(--sunken);border-radius:10px;padding:8px 10px;min-height:42px;text-align:left;justify-content:flex-start;font-weight:600;color:var(--ink);width:100%}
.meal .lbl{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;width:44px}
.meal .g{flex:1;min-width:0;overflow-wrap:anywhere}
.meal.empty-slot .g{color:var(--muted);font-weight:500}
.meal .who{font-size:.75rem;color:var(--muted);flex:none}
.hours-group{display:grid;gap:8px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.hours-group .hg-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.hours-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hours-row .d{font-size:.8rem;color:var(--muted);width:46px}
.hours-row .x{font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.chip.cart{background:var(--ok-soft);color:var(--ok)}
.chip.priv{background:var(--c-bday-soft);color:var(--c-bday)}
.shop-add{display:grid;grid-template-columns:1fr 88px auto;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.shop-add button{min-width:52px;font-size:1.3rem}
.shop-list{display:grid;gap:6px}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:52px}
.shop-item .t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.shop-item .m{color:var(--muted);font-size:.85rem;white-space:nowrap}
.shop-item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.check{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none}
.shop-item.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.shop-item.done .check::after{content:"✓";font-weight:800}
.day-head{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 4px 0}
.src-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.connect{display:grid;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.connect h3{font-size:1rem}
.connect ol{margin:0;padding-left:20px;color:var(--muted);font-size:.88rem;display:grid;gap:4px}
.chip.idea{background:var(--warn-soft);color:var(--warn)}
.idea-card{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.idea-card.done{opacity:.6;box-shadow:none}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.idea-card .t{font-weight:800;overflow-wrap:anywhere}
.idea-card p{margin:0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;white-space:pre-line}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chips-row button{min-height:34px;padding:5px 12px;font-size:.8rem}
.chips-row button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.money{background:var(--ok-soft);color:var(--ok)}
.debtor{display:grid;gap:10px}
.debtor-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.chip.lend{background:var(--c-car-soft);color:var(--c-car)}
.tag-tracker{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:999px;padding:3px 9px}
.tag-tracker svg.i{width:13px;height:13px}
.chip.ablage{background:var(--sunken);color:var(--ink)}
.chip.fix{background:var(--c-fix-soft);color:var(--c-fix)}
.date-block.fix{background:var(--c-fix-soft);color:var(--c-fix)}
.ampel{display:inline-flex;gap:3px;padding:3px 5px;background:#14161C;border-radius:999px;flex:none}
.ampel i{width:9px;height:9px;border-radius:50%;background:#3A3E48;display:block}
.ampel i.on.r{background:#FF3B3B;box-shadow:0 0 6px #FF3B3B}
.ampel i.on.y{background:#FFC83D;box-shadow:0 0 6px #FFC83D}
.ampel i.on.g{background:#2FD27A;box-shadow:0 0 6px #2FD27A}
.ampel-row{border-left:5px solid var(--line)}
.ampel-row.ok{border-left-color:var(--ok)}
.ampel-row.warn{border-left-color:var(--warn)}
.ampel-row.crit{border-left-color:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.share-badge{min-height:28px;padding:3px 10px;font-size:.72rem;gap:5px;border-radius:999px;background:var(--sunken);border:none;color:var(--muted);margin-left:auto}
.share-badge svg.i{width:14px;height:14px}
.share-badge.partner{background:var(--c-fix-soft);color:var(--c-fix)}
.share-badge.alle{background:var(--ok-soft);color:var(--ok)}
.share-badge:hover{border:none;color:var(--ink)}
.tile-title{flex:1 0 auto;max-width:100%}
.tile-head{flex-wrap:wrap;row-gap:8px}
.tile-head .count{margin-left:auto}
.share-list{display:grid;gap:8px}
.share-row{display:grid;grid-template-columns:1fr minmax(0,260px);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunken)}
.share-row .t{font-weight:700}
.share-row select{background:var(--surface)}
@media (max-width:520px){.share-row{grid-template-columns:1fr}}

.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px 20px;background:linear-gradient(135deg,#B3125A,#E0367F 55%,#C9352A);color:#fff;display:grid;gap:4px;box-shadow:var(--shadow)}

@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}50%{transform:translate(14px,95px) rotate(180deg)}90%{opacity:.8}100%{transform:translate(-6px,200px) rotate(360deg);opacity:0}}

.hero .fx .butterfly{top:30%;left:-40px;font-size:20px;animation:angel 18s ease-in-out infinite}

/* ---------- Standdienst ---------- */
const SCHICHT_AUFGABEN = ["Glühwein & Punsch","Kinderpunsch","Waffeln","Crêpes","Würstchen & Essen","Kasse","Spülen","Aufbau","Abbau","Springerin"];
const helferOf = s => Array.isArray(s.helfer) ? s.helfer : [];
const isMine = s => helferOf(s).some(h => h.uid === uid);
const freiOf = s => { const p = parseInt(s.plaetze, 10); return isFinite(p) && p > 0 ? Math.max(0, p - helferOf(s).length) : null; };
const schichtSort = (a,b) => (String(a.datum) + (a.von || "")).localeCompare(String(b.datum) + (b.von || "")) || String(a.aufgabe).localeCompare(String(b.aufgabe));
const schichtZukunft = () => ofKind("schicht").filter(s => (parseDate(s.datum) || 0) >= today()).sort(schichtSort);
const zeitStr = s => (s.von || "") + (s.bis ? "–" + s.bis : "");
let sdFilter = "alle";
function viewStanddienst(){
  const w = canWrite("standdienst"); const t0 = today();
  const all = ofKind("schicht").slice().sort(schichtSort);
  let list = all.filter(s => (parseDate(s.datum) || t0) >= t0);
  if (sdFilter === "meine") list = list.filter(isMine);
  if (sdFilter === "frei") list = list.filter(s => (freiOf(s) ?? 1) > 0);
  const past = all.filter(s => (parseDate(s.datum) || t0) < t0).reverse();
  const days = [...new Set(list.map(s => s.datum))];
  const card = s => { const f = freiOf(s), h = helferOf(s), mine = isMine(s), p = parseInt(s.plaetze, 10);
    const slots = [...h.map(x => `<span class="helper">${esc(x.name || "?")}</span>`), ...(f ? Array.from({ length: f }, () => `<span class="helper free">frei</span>`) : [])];
    return `<div class="shift ${mine ? "mine" : ""} ${f === 0 && !mine ? "full" : ""}">
      <div class="shift-head"><span class="shift-time">${esc(zeitStr(s) || "ganztags")}</span><span class="t">${esc(s.aufgabe || "Standdienst")}</span>${f === null ? "" : `<span class="pill ${f === 0 ? "ok" : f >= Math.ceil((p || 1) / 2) ? "warn" : "neutral"}">${h.length}/${p}</span>`}</div>
      ${slots.length ? `<div class="helpers">${slots.join("")}</div>` : `<div class="muted" style="font-size:.85rem">Noch niemand eingetragen</div>`}
      ${s.notiz ? `<div class="muted" style="font-size:.85rem;overflow-wrap:anywhere">${esc(s.notiz)}</div>` : ""}

        ${w ? `<button class="ghost" data-act="edit" data-id="${s.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${s.id}">Löschen</button>` : ""}</div>
    </div>`; };
  return `<section style="display:grid;gap:14px">
    <div class="view-head">${backBtn}${w ? `<div class="toolbar"><button data-act="new-plan">${ICON.cal}Mehrere anlegen</button><button class="primary" data-act="new-schicht">${ICON.plus}Schicht</button></div>` : ""}</div>
    <h2 class="page-title">Standdienst</h2>
    <p class="muted" style="margin:-6px 0 0;font-size:.9rem">Tipp auf <b>„Ich bin dabei“</b>, um dich einzutragen. Am Vorabend kommt eine Erinnerung.</p>
    <div class="seg" role="tablist">${[["alle","Alle"],["frei","Mit freien Plätzen"],["meine",`Meine (${schichtZukunft().filter(isMine).length})`]].map(([k,l]) => `<button role="tab" class="${sdFilter===k?"on":""}" data-act="sd-filter" data-f="${k}">${l}</button>`).join("")}</div>

}
function formSchicht(s = {}){
  openModal(`<form id="frm" data-kind="schicht" data-id="${s.id||""}" style="display:grid;gap:14px">${head(s.id ? "Schicht bearbeiten" : "Schicht anlegen")}

        <div class="chips-row">${SCHICHT_AUFGABEN.map((a, i) => `<label class="pick"><input type="checkbox" name="auf" value="${esc(a)}" ${i < 3 || a === "Kasse" ? "checked" : ""}>${esc(a)}</label>`).join("")}</div>
        <input name="extra" placeholder="Weitere Aufgabe (optional)"></div>

const toMin = t => { const m = /^(\d\d):(\d\d)$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
const toHM = m => `${String(Math.floor(m / 60) % 24).padStart(2,"0")}:${String(m % 60).padStart(2,"0")}`;
async function savePlan(form){
  const fd = new FormData(form);
  const a = toMin(fd.get("von")), b0 = toMin(fd.get("bis")), block = Number(fd.get("block"));
  if (a == null || b0 == null) return toast("Bitte Von und Bis eintragen.");
  const b = b0 <= a ? b0 + 1440 : b0;
  const auf = [...fd.getAll("auf"), String(fd.get("extra") || "").trim()].filter(Boolean);
  if (!auf.length) return toast("Bitte mindestens eine Aufgabe wählen.");
  const blocks = []; for (let t = a; t < b; t += (block || (b - a))) blocks.push([t, Math.min(b, t + (block || (b - a)))]);
  const rows = []; for (const [x, y] of blocks) for (const au of auf) rows.push({ tile: "standdienst", kind: "schicht", data: { kind: "schicht", aufgabe: au, datum: String(fd.get("datum")), von: toHM(x), bis: toHM(y), plaetze: parseInt(fd.get("plaetze"), 10) || 2, notiz: "", helfer: [] } });
  if (rows.length > 80) return toast("Das wären über 80 Schichten – bitte größere Blöcke wählen.");
  const btn = $("#planSave"); btn.disabled = true; btn.textContent = `${rows.length} Schichten werden angelegt …`;
  const { error } = await sb.from("fm_items").insert(rows);
  if (error) { btn.disabled = false; btn.textContent = "Anlegen"; return toast("Anlegen hat nicht geklappt."); }
  closeModal(); toast(`${rows.length} Schichten angelegt`); sdFilter = "alle"; await loadItems();
}

  return n < 0 ? { cls: "crit", txt: `überfällig seit ${fmtDate(a.bis)}` } : n <= 2 ? { cls: "warn", txt: "bis " + daysText(n) } : { cls: "neutral", txt: "bis " + wd(a.bis) };

  const item = a => { const s = aufStatus(a); return `<div class="task-item ${a.erledigt ? "done" : ""}">

/* Jahreszeiten im Banner: Herbst Blätter, Winter Schnee, Nikolaus, Weihnachten, Frühling Blumen, Sommer Badesaison. Test: ?saison=herbst|winter|nikolaus|weihnachten|fruehling|sommer */
const rnd = (i, n) => (Math.sin(i * 97.13 + n * 13.7) + 1) / 2;
const fallers = (count, glyphs, cls, size = [8, 20], dur = [5, 11]) => Array.from({ length: count }, (_, i) => `<i class="fall ${cls}" style="left:${(rnd(i,1) * 100).toFixed(1)}%;font-size:${(size[0] + rnd(i,2) * (size[1] - size[0])).toFixed(0)}px;animation-duration:${(dur[0] + rnd(i,3) * (dur[1] - dur[0])).toFixed(1)}s;animation-delay:-${(rnd(i,4) * 10).toFixed(1)}s">${glyphs[i % glyphs.length]}</i>`).join("");
function saison(){
  const q = new URLSearchParams(location.search).get("saison"); if (q) return q;
  const d = new Date(), m = d.getMonth() + 1, t = d.getDate();
  if (m === 12 && (t === 5 || t === 6)) return "nikolaus";
  if (m === 12 && t >= 24 && t <= 26) return "weihnachten";
  if (m === 12 || m <= 2) return "winter";
  if (m <= 5) return "fruehling";
  if (m <= 8) return "sommer";
  return "herbst";
}
const SAISON = { herbst: ["autumn", "🍁"], winter: ["", "❄"], nikolaus: ["", "❄"], weihnachten: ["", "⭐"], fruehling: ["spring", "🌸"], sommer: ["summer", ""] };
function saisonFx(){
  const z = saison(); const snow = fallers(16, ["❄","•","❄"], "snow");
  if (z === "herbst") return fallers(12, ["🍂","🍁","🍂","🍃"], "leaf", [18, 30], [7, 12]);
  if (z === "nikolaus") return fallers(10, ["❄","•"], "snow") + `<i class="walk"><b>🎅</b><b style="animation-delay:.25s">🎁</b></i>`;
  if (z === "weihnachten") return fallers(10, ["❄","•","✨"], "snow") + `<i class="sleigh">🦌🦌🛷🎅</i>`;
  if (z === "fruehling") return Array.from({ length: 9 }, (_, i) => `<i class="flower" style="left:${(4 + i * 11 + rnd(i,1) * 5).toFixed(0)}%;font-size:${(18 + rnd(i,2) * 10).toFixed(0)}px;animation-delay:-${(rnd(i,3) * 9).toFixed(1)}s">${["🌷","🌼","🌸","🌱","🌻"][i % 5]}</i>`).join("") + `<i class="butterfly">🦋</i>`;
  if (z === "sommer") return `<i class="sun">☀️</i><i class="waves w2"></i><i class="waves"></i><i class="swim"><b>🏊‍♀️</b></i><i class="ball">🏐</i>`;
  return snow;
}

const PUSH_CATS = [["schicht","Meine Schicht – am Vorabend","standdienst"],["frei","Morgen noch Plätze frei","standdienst"],["termin","Termine – am Vorabend","termine"],["aufgabe","Aufgaben – am Tag vor der Frist","aufgaben"],["neu","Neue Einträge von anderen",null]];
const PUSH = { on: false, row: null, endpoint: null };
const pushSupported = () => ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const b64ToBytes = b64 => { const pad = "=".repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function refreshPush(){
  if (!pushSupported()) return;
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    PUSH.endpoint = sub ? sub.endpoint : null;
    if (PUSH.endpoint) { const { data } = await sb.from("fm_push_subs").select("*").eq("endpoint", PUSH.endpoint).maybeSingle(); PUSH.row = data; PUSH.on = !!data; }
    else { PUSH.row = null; PUSH.on = false; }
  } catch { PUSH.on = false; }
}
async function enablePush(btn){
  if (!pushSupported()) return toast("Dieses Gerät unterstützt hier keine Benachrichtigungen.");
  if (btn) { btn.disabled = true; btn.textContent = "Wird eingeschaltet …"; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Benachrichtigungen wurden nicht erlaubt. Das lässt sich in den Handy-Einstellungen ändern."); return; }
    const r = await fetch(SB_URL + "/functions/v1/fm-push", { headers: { apikey: SB_KEY } });
    const { publicKey } = await r.json();
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    const j = sub.toJSON();
    const prefs = Object.fromEntries(PUSH_CATS.map(([k]) => [k, true]));
    const { error } = await sb.from("fm_push_subs").upsert({ user_id: uid, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, prefs: { ...(PUSH.row?.prefs || {}), ...prefs, ...(PUSH.row?.prefs || {}) } }, { onConflict: "endpoint" });
    if (error) throw error;
    await refreshPush(); toast("Benachrichtigungen sind an"); openPush();
  } catch (e) { console.warn(e); toast("Einschalten hat nicht geklappt. Bitte nochmal versuchen."); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = "Benachrichtigungen einschalten"; } }
}
async function disablePush(){
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) { await sb.from("fm_push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); } } catch (e) { console.warn(e); }
  await refreshPush(); toast("Benachrichtigungen sind aus"); openPush(); render();
}
function openPush(){
  let body;
  if (!pushSupported()) {
    body = isIOS() && !isStandalone()
      ? `<div class="scan-status warn">Auf dem iPhone gehen Benachrichtigungen nur in der installierten App.</div><ol class="muted" style="margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem"><li>In Safari unten auf <b>Teilen</b> tippen → <b>„Zum Home-Bildschirm“</b>.</li><li>Alarmstufe Pink über das neue Icon öffnen.</li><li>Dort im Menü <b>Benachrichtigungen</b> einschalten.</li></ol>`
      : `<div class="scan-status warn">Dieser Browser unterstützt leider keine Benachrichtigungen. Nimm auf dem iPhone Safari (iOS 16.4 oder neuer), auf Android Chrome.</div>`;
  } else if (!PUSH.on) {
    body = `<p class="muted" style="margin:0">Du bekommst Nachrichten aufs Handy, z. B. am Vorabend deiner Schicht, wenn morgen noch Plätze frei sind oder jemand etwas Neues einträgt – nur für Kacheln, die du sehen darfst.</p>
      <button class="primary" data-act="push-on">Benachrichtigungen einschalten</button>
      <p class="muted" style="margin:0;font-size:.8rem">Gilt für dieses Gerät. Auf weiteren Geräten einfach dort auch einschalten.</p>`;
  } else {
    const prefs = PUSH.row?.prefs || {};
    const cats = PUSH_CATS.filter(([,, t]) => !t || visible(t));
    body = `<div class="scan-status ok">Benachrichtigungen sind auf diesem Gerät an.</div>
      <div class="menu-list">${cats.map(([k, l]) => `<label class="check" style="justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--sunken);color:var(--ink)"><span>${esc(l)}</span><input type="checkbox" data-pushcat="${k}" ${prefs[k] !== false ? "checked" : ""} style="width:22px;height:22px"></label>`).join("")}</div>
      <div class="toolbar"><button data-act="push-test">Testnachricht senden</button><button class="ghost danger" data-act="push-off">Ausschalten</button></div>
      <p class="muted" style="margin:0;font-size:.8rem">Die Erinnerungen am Vorabend kommen gegen 18 Uhr.</p>`;
  }
  openModal(`${head("Benachrichtigungen")}${body}`);
}

/* ---------- Hinweise ---------- */
function hinweise(){
  const out = []; const h0 = iso(today()), m = new Date(today()); m.setDate(m.getDate() + 1); const m0 = iso(m);
  if (me.owner) { const p = members.filter(x => x.status === "pending").length; if (p) out.push({ cls: "warn", icon: ICON.people, href: "#", act: "share", text: `<b>${p} ${p === 1 ? "Person wartet" : "Personen warten"} auf Freigabe</b> – jetzt Kacheln freigeben` }); }
  if (visible("standdienst")) {
    for (const s of schichtZukunft().filter(isMine).filter(s => s.datum === h0 || s.datum === m0)) out.push({ cls: s.datum === h0 ? "crit" : "warn", icon: ICON.shift, href: "#standdienst", text: `<b>${s.datum === h0 ? "Heute" : "Morgen"} Standdienst:</b> ${esc(zeitStr(s))} Uhr · ${esc(s.aufgabe || "")}` });
    const bald = schichtZukunft().filter(s => Math.round((parseDate(s.datum) - today())/86400000) <= 7 && (freiOf(s) || 0) > 0);
    const frei = bald.reduce((x, s) => x + freiOf(s), 0);
    if (frei) out.push({ cls: "info", icon: ICON.shift, href: "#standdienst", text: `<b>${frei} freie Plätze</b> im Standdienst in den nächsten 7 Tagen – wer kann?` });
  }
  if (visible("aufgaben")) { const ue = aufOffen().filter(a => aufStatus(a).cls === "crit"); if (ue.length) out.push({ cls: "crit", icon: ICON.task, href: "#aufgaben", text: `<b>${ue.length} Aufgabe${ue.length === 1 ? "" : "n"} überfällig:</b> ${esc(ue.slice(0, 2).map(a => a.titel).join(", "))}${ue.length > 2 ? " …" : ""}` }); }
  if (visible("termine")) for (const t of upcoming().filter(t => t.datum === h0 || t.datum === m0)) out.push({ cls: "info", icon: ICON.cal, href: "#termine", text: `<b>${t.datum === h0 ? "Heute" : "Morgen"}:</b> ${esc(t.titel)}${t.zeit ? " · " + esc(t.zeit) + " Uhr" : ""}${t.ort ? " · " + esc(t.ort) : ""}` });
  if (!PUSH.on && pushSupported() && (() => { try { return !localStorage.getItem("fwm-push-hint"); } catch { return true; } })()) out.push({ cls: "info", icon: ICON.bell, href: "#", act: "push-open", text: `<b>Benachrichtigungen einschalten</b> – Erinnerung an deine Schicht direkt aufs Handy` });
  return out;
}
/* Neuigkeiten pro Person: neu freigegebene Kacheln und Änderungen anderer seit dem letzten Besuch */
const SEEN_KEY = "fwm-gesehen";
let seen = (() => { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch { return null; } })();
const firstVisitTs = Date.now();
const itemTitle = it => it.kind === "schicht" ? `${it.aufgabe || "Schicht"} ${wd(it.datum)} ${zeitStr(it)}` : it.kind === "produkt" ? it.produkt : it.kind === "material" ? it.gegenstand : it.kind === "einkauf" ? it.name : it.kind === "buchung" ? it.zweck : (it.titel || "Eintrag");
function neuigkeiten(){
  if (S.mode !== "db") return { tiles: [], changes: [] };
  const vis = TILES.map(([k]) => k).filter(visible);
  const since = seen?.ts ?? firstVisitTs;
  const tiles = me.owner ? [] : vis.filter(k => !(seen?.tiles || []).includes(k));
  const changes = S.items.filter(i => visible(tileOf(i)) && i._by && i._by !== uid && (i.geaendert || 0) > since).sort((a,b) => b.geaendert - a.geaendert);
  return { tiles, changes };
}
function markSeen(){
  seen = { ts: Date.now(), tiles: TILES.map(([k]) => k).filter(visible) };
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch {}
  render();
}
function neuigkeitenHtml(){
  const { tiles, changes } = neuigkeiten();
  if (!tiles.length && !changes.length) return "";
  loadNames([...new Set(changes.map(c => c._by))]);
  const label = Object.fromEntries(TILES);
  const rows = [
    ...tiles.map(k => `<a class="notice info" href="#${k}">${ICON.people}<span><b>Für dich freigegeben:</b> ${esc(label[k])}</span></a>`),
    ...changes.slice(0, 6).map(c => { const who = names[c._by] || "Jemand"; const neu = (c.erstellt || 0) > (seen?.ts ?? firstVisitTs); return `<a class="notice info" href="#${tileOf(c)}">${ICON.bell}<span><b>${esc(who)}</b> hat „${esc(itemTitle(c))}“ in ${esc(label[tileOf(c)])} ${neu ? "hinzugefügt" : "geändert"}</span></a>`; })
  ];
  if (changes.length > 6) rows.push(`<span class="muted" style="font-size:.85rem;padding-left:4px">+ ${changes.length - 6} weitere Änderungen</span>`);

}

function hinweiseHtml(){

async function saveShare(form){
  const fd = new FormData(form);
  for (const m of members) {
    if (m.user_id === uid) { const n = String(fd.get("selfName") || "").trim(); if (n !== (m.name || "")) { await sb.from("fm_members").update({ name: n }).eq("user_id", uid); member.name = n; } continue; }
    const status = fd.get("status-" + m.user_id) || m.status, role = fd.get("role-" + m.user_id) || m.role;
    const tiles = role === "admin" || m.role === "admin" ? (m.tiles || {}) : Object.fromEntries(TILES.map(([k]) => [k, fd.get(`t-${m.user_id}-${k}`) || "none"]).filter(([,v]) => v !== "none"));
    if (status !== m.status || role !== m.role || JSON.stringify(tiles) !== JSON.stringify(m.tiles || {})) {
      const { error } = await sb.from("fm_members").update({ status, role, tiles }).eq("user_id", m.user_id);
      if (error) throw error;
    }
  }
  await loadMembers(); namesLoaded = false; loadNames();
}

const head = t => `<div class="sheet-head"><h3>${t}</h3><button class="ghost" data-act="close" aria-label="Schließen">✕</button></div>`;

async function submitForm(form){
  const kind = form.dataset.kind, id = form.dataset.id || undefined;
  const fd = Object.fromEntries(new FormData(form).entries());
  const old = id ? S.items.find(i => i.id === id) || {} : {};
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Speichert …";
  const fail = (msg, sel) => { btn.disabled = false; btn.textContent = "Speichern"; if (sel) $(sel)?.focus(); toast(msg); };
  const money = v => { const n = parseAmount(v); return isFinite(n) ? Math.round(n * 100) / 100 : ""; };
  const tx = k => String(fd[k] ?? "").trim();
  try {
    let obj;
    if (kind === "schicht") obj = { ...old, kind, aufgabe: tx("aufgabe"), datum: fd.datum, von: fd.von || "", bis: fd.bis || "", plaetze: parseInt(fd.plaetze, 10) || 1, notiz: tx("notiz"), helfer: helferOf(old) };
    else if (kind === "aufgabe") obj = { ...old, kind, titel: tx("titel"), wer: tx("wer"), bis: fd.bis || "", kategorie: fd.kategorie, notiz: tx("notiz"), erledigt: !!old.erledigt };
    else if (kind === "termin") obj = { ...old, kind, titel: tx("titel"), art: fd.art, datum: fd.datum, zeit: fd.zeit || "", zeitBis: fd.zeitBis || "", ort: tx("ort"), notiz: tx("notiz") };
    else if (kind === "material") obj = { ...old, kind, gegenstand: tx("gegenstand"), menge: tx("menge"), kategorie: fd.kategorie, wer: tx("wer"), wo: tx("wo"), notiz: tx("notiz"), eingepackt: !!old.eingepackt };
    else if (kind === "produkt") obj = { ...old, kind, produkt: tx("produkt"), preis: money(fd.preis), pfand: money(fd.pfand), kategorie: fd.kategorie, rezept: tx("rezept"), aus: !!old.aus };
    else if (kind === "buchung") {
      const betrag = parseAmount(fd.betrag);
      if (!isFinite(betrag) || betrag <= 0) return fail("Bitte einen gültigen Betrag eingeben, z. B. 24,90", "#bu-betrag");
      const typ = form.dataset.typ;
      obj = { ...old, kind, typ, zweck: tx("zweck"), betrag: Math.round(betrag * 100) / 100, datum: fd.datum, kategorie: fd.kategorie, wer: tx("wer"), privat: typ === "ausgabe" && !!fd.privat, erstattet: !!old.erstattet, notiz: tx("notiz") };
    }
    else if (kind === "info") obj = { ...old, kind, typ: form.dataset.typ, titel: tx("titel"), text: tx("text"), telefon: tx("telefon"), link: tx("link"), pin: !!fd.pin };
    else return fail("Unbekannter Eintrag.");
    delete obj.id; delete obj.geaendert;
    await saveItem({ id, ...obj });
    closeModal(); toast("Gespeichert");
  } catch (e) { fail("Speichern hat nicht geklappt. Bitte erneut versuchen."); }

  else if (act === "mat-toggle" && it) quickSave(el, { ...it, eingepackt: !it.eingepackt });
  else if (act === "mat-reset") { if (el.dataset.sure) { el.disabled = true; Promise.all(ofKind("material").filter(m => m.eingepackt).map(m => sb.from("fm_items").update({ tile: "material", kind: "material", data: { ...cleanItem(m), eingepackt: false } }).eq("id", m.id))).then(() => { toast("Packliste zurückgesetzt"); loadItems(); }); } else { el.dataset.sure = "1"; el.textContent = "Wirklich zurücksetzen?"; } }
  else if (act === "prod-aus" && it) quickSave(el, { ...it, aus: !it.aus });
  else if (act === "preisliste") openPreisliste();
  else if (act === "ka-filter") { kaFilter = el.dataset.f; render(); }
  else if (act === "ka-erst" && it) quickSave(el, { ...it, erstattet: !it.erstattet }, it.erstattet ? "Wieder offen" : "Als erstattet markiert");
  else if (act === "ka-export") exportKasse();
  else if (act === "share-all") { const u = el.dataset.uid, v = el.dataset.v; document.querySelectorAll(`#shareFrm select[name^="t-${u}-"]`).forEach(s => s.value = v); const st = document.querySelector(`#shareFrm select[name="status-${u}"]`); if (st && v !== "none" && st.value === "pending") st.value = "approved"; }
  else if (act === "copy") { const t = el.dataset.text; (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast("Adresse kopiert"), () => window.prompt?.("Adresse kopieren:", t)); }
  else if (act === "home") { closeModal(); if (location.hash && location.hash !== "#") location.hash = ""; else render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act === "menu") openMenu();
  else if (act === "set-name") { closeModal(); openName(); }
  else if (act === "push-open") { try { localStorage.setItem("fwm-push-hint", "1"); } catch {} closeModal(); openPush(); render(); }
  else if (act === "push-on") enablePush(el);
  else if (act === "push-off") disablePush();
  else if (act === "push-test") { el.disabled = true; sb.functions.invoke("fm-push", { body: { test: true } }).then(({ data, error }) => { el.disabled = false; toast(error ? "Testnachricht hat nicht geklappt." : data?.sent ? "Testnachricht verschickt" : "Kein Gerät gefunden – bitte aus- und wieder einschalten."); }); }
  else if (act === "share") { closeModal(); openShare(); }
  else if (act === "logout") sb.auth.signOut();
  else if (act === "set-pw") { closeModal(); openPassword(); }
  else if (act === "login-mode") { loginMode = el.dataset.m; render(); }
  else if (act === "reload") refreshAll();
  else if (act === "member-del") { const u = el.dataset.uid; if (el.dataset.sure) { sb.from("fm_members").delete().eq("user_id", u).then(({ error }) => { if (error) toast("Entfernen hat nicht geklappt."); else { closeModal(); toast("Person entfernt"); loadMembers().then(render); } }); } else { el.dataset.sure = "1"; el.textContent = "Wirklich entfernen?"; } }
  else if (act === "seen") markSeen();
});
const cleanItem = it => { const { id, _tile, _by, erstellt, geaendert, ...data } = it; return data; };
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "loginFrm") return sendLink(f, e.submitter);
  if (f.id === "einkaufFrm") {
    const fd = new FormData(f); const name = String(fd.get("name") || "").trim(); if (!name) return;
    const menge = String(fd.get("menge") || "").trim(); f.reset();
    try { await saveItem({ kind: "einkauf", name, menge, wer: "", erledigt: false }); } catch { toast("Speichern hat nicht geklappt."); }
    $("#ek-name")?.focus(); return;
  }
  if (f.id === "planFrm") return savePlan(f);
  if (f.id === "nameFrm") {
    const n = String(new FormData(f).get("name") || "").trim(); if (!n) return;
    const { error } = await sb.rpc("fm_set_name", { n });
    if (error) return toast("Speichern hat nicht geklappt.");
    member.name = n; names[uid] = n; closeModal(); toast("Name gespeichert"); $("#storeStatus").textContent = n + (me.owner ? " · Admin" : ""); render(); return;
  }
  if (f.id === "pwFrm") {
    const fd = new FormData(f);
    if (fd.get("pw1") !== fd.get("pw2")) return toast("Die Passwörter stimmen nicht überein.");
    const { error } = await sb.auth.updateUser({ password: String(fd.get("pw1")) });
    if (error) return toast("Passwort konnte nicht gespeichert werden: " + error.message);
    closeModal(); return toast("Passwort gespeichert");
  }
  if (f.id === "shareFrm") {
    const btn = $("#shareSave"); btn.disabled = true; btn.textContent = "Wird gespeichert …";
    try { await saveShare(f); closeModal(); toast("Freigaben gespeichert"); render(); }
    catch (err) { btn.disabled = false; btn.textContent = "Speichern"; toast(/mindestens ein Admin/.test(err?.message || "") ? "Es muss mindestens ein Admin bleiben." : "Freigaben konnten nicht gespeichert werden."); }
    return;
  }
  submitForm(f);
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.pushcat && PUSH.row) { const prefs = { ...(PUSH.row.prefs || {}), [e.target.dataset.pushcat]: e.target.checked }; sb.from("fm_push_subs").update({ prefs }).eq("id", PUSH.row.id).then(({ error }) => { if (error) toast("Speichern hat nicht geklappt."); else { PUSH.row.prefs = prefs; toast(e.target.checked ? "Eingeschaltet" : "Ausgeschaltet"); } }); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalRoot").innerHTML) closeModal(); });

render();
initStore();
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
