<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="H&amp;E Hub">
<title>H&amp;E Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: App-Shell mit Markenkopf (H&E), Kachel-Dashboard → Detailansichten per #hash; weiche Flächen, große Radien, Icon-Chips je Bereich */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#EBEDF2; --ink:#14161C; --muted:#646B7A; --line:#E2E5EB;
  --accent:#2E5BFF; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --c-car:#2E5BFF; --c-car-soft:#E6ECFF; --c-cal:#0E9F8E; --c-cal-soft:#DDF4F1; --c-bill:#E86A2C; --c-bill-soft:#FDEBDF; --c-bin:#5B6B2E; --c-bin-soft:#ECF0DD; --c-bday:#D63F7A; --c-bday-soft:#FCE3EE; --c-fix:#6A4CC7; --c-fix-soft:#EEE9FB;
  --ok:#14874F; --ok-soft:#DCF3E7; --warn:#B26A00; --warn-soft:#FCEED6; --crit:#D02B36; --crit-soft:#FCE1E3;
  --shadow:0 1px 2px rgba(20,22,28,.04),0 8px 24px rgba(20,22,28,.06);
  --shadow-hi:0 2px 4px rgba(20,22,28,.06),0 18px 40px rgba(20,22,28,.10);
  --plate:#FFFFFF; --plate-ink:#111111; --plate-eu:#1E47C8;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-lg:22px;
  --logo-a:#5B82FF; --logo-b:#2E5BFF; --logo-c:#1631A8; --logo-amp:#FFD27A; --logo-glow:rgba(46,91,255,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#171A21; --sunken:#1F232C; --ink:#EEF0F4; --muted:#9AA1B0; --line:#262B35;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2540;
  --c-car:#7C9BFF; --c-car-soft:#1D2540; --c-cal:#3FD3BF; --c-cal-soft:#123331; --c-bill:#FF9A63; --c-bill-soft:#3A2418; --c-bin:#B9CC7A; --c-bin-soft:#262C17; --c-bday:#FF7FB0; --c-bday-soft:#3A1828; --c-fix:#AE98FF; --c-fix-soft:#261E40;
  --ok:#4CD38C; --ok-soft:#13301F; --warn:#F2B24F; --warn-soft:#352812; --crit:#FF6B75; --crit-soft:#3A181C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);
  --plate:#F1F1EE; --plate-ink:#111111; --plate-eu:#2450D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#171A21; --sunken:#1F232C; --ink:#EEF0F4; --muted:#9AA1B0; --line:#262B35;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2540;
  --c-car:#7C9BFF; --c-car-soft:#1D2540; --c-cal:#3FD3BF; --c-cal-soft:#123331; --c-bill:#FF9A63; --c-bill-soft:#3A2418; --c-bin:#B9CC7A; --c-bin-soft:#262C17; --c-bday:#FF7FB0; --c-bday-soft:#3A1828; --c-fix:#AE98FF; --c-fix-soft:#261E40;
  --ok:#4CD38C; --ok-soft:#13301F; --warn:#F2B24F; --warn-soft:#352812; --crit:#FF6B75; --crit-soft:#3A181C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);
  --plate:#F1F1EE; --plate-ink:#111111; --plate-eu:#2450D0; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{overflow-x:hidden;max-width:100%}
@media (max-width:600px){
  .table-wrap{overflow:visible;background:none;border:none;box-shadow:none}
  .table-wrap table{min-width:0}
  .table-wrap thead{display:none}
  .table-wrap tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .table-wrap td{display:block;padding:0;border:none;background:none!important}
  .table-wrap tbody td:nth-child(1){grid-column:1;grid-row:1/4}
  .table-wrap tbody td:nth-child(2){grid-column:2;grid-row:1;font-size:.8rem;color:var(--muted)}
  .table-wrap tbody td:nth-child(3){grid-column:2;grid-row:2}
  .table-wrap tbody td:nth-child(4){grid-column:2;grid-row:3}
  .table-wrap tbody td:nth-child(5){grid-column:3;grid-row:2;font-size:.78rem;color:var(--muted)}
  .table-wrap tbody td:nth-child(6){grid-column:3;grid-row:1;font-weight:800}
  .table-wrap tbody td:nth-child(7){grid-column:1/-1;grid-row:4;text-align:left!important;white-space:normal!important}
  .table-wrap tfoot tr{grid-template-columns:1fr auto auto;background:var(--sunken)}
  .table-wrap td:empty{display:none}
  .row .acts,.toolbar{gap:6px}
  .row .acts button,.toolbar button{min-height:38px;padding:6px 12px}
  .view-head .btn,.view-head button{min-height:40px;padding:8px 14px}
  .page-title{font-size:1.45rem}
  .sheet{padding:18px}
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.1rem;font-weight:700}
.page-title{font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em}
.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button,.btn{font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:42px;transition:background .15s,border-color .15s,transform .1s}
button:hover,.btn:hover{border-color:var(--muted)}
button:active,.btn:active{transform:scale(.97)}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.primary:hover{border-color:var(--ink);opacity:.9}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ghost:hover{background:var(--sunken);border-color:transparent;color:var(--ink)}
.danger{color:var(--crit)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;background:#000;border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.logo .mono{color:#fff;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;line-height:1}
.logo .amp{font-weight:600;margin:0 .04em}
.wordmark{display:flex;align-items:baseline;font-weight:800;letter-spacing:-.02em;font-size:1.6rem;line-height:1}
.wordmark .amp{font-weight:600;margin:0 .06em}
.wordmark .hub{font-weight:400;color:var(--muted);margin-left:.28em;letter-spacing:-.01em}
.status{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.hello{display:grid;gap:4px}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
.t2{position:relative;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:var(--shadow);min-width:0;min-height:128px;transition:transform .15s,box-shadow .15s}
.t2:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.t2:active{transform:scale(.98)}
.t2-top{display:flex;align-items:center;gap:8px;min-width:0}
.t2 .chip{width:34px;height:34px;border-radius:11px;flex:none}
.t2 .chip svg.i{width:18px;height:18px}
.t2-title{font-weight:800;font-size:.95rem;letter-spacing:-.01em;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.t2-body{display:grid;align-content:end;gap:2px;min-width:0}
.t2-main{font-weight:700;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
.t2-main.num{font-size:1.25rem}
.t2-sub{font-size:.8rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.t2-dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:transparent}
.t2-dot.ok{background:var(--ok)}
.t2-dot.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.t2-dot.crit{background:var(--crit);box-shadow:0 0 0 4px var(--crit-soft)}
.t2-share{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:3px;min-height:0;padding:3px 7px;border:none;border-radius:999px;background:var(--sunken);color:var(--muted);font-size:.68rem;font-weight:700}
.t2-share svg.i{width:12px;height:12px}
.t2-share:hover{border:none;color:var(--ink)}
.t2.has-share .t2-sub{padding-right:30px}
.t2.warn{border-color:var(--warn)}
.t2.crit{border-color:var(--crit)}
.homebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.homebar button{pointer-events:auto;min-height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);border:none;font-size:.95rem;box-shadow:var(--shadow-hi);gap:10px}
.homebar button.on{opacity:.92}
.homebar button:hover{border:none;opacity:.9}
.homebar svg.i{width:22px;height:22px}
.brand{cursor:pointer;border:none;background:none;padding:0;color:inherit;font:inherit;text-align:left;min-height:0}
.brand:hover{border:none}
.menu-btn{width:44px;height:44px;padding:0;border-radius:14px}
.menu-list{display:grid;gap:8px}
.menu-list button{justify-content:flex-start;border-radius:14px;min-height:50px;background:var(--sunken);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:18px;cursor:pointer;min-width:0;text-align:left;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.tile:hover{box-shadow:var(--shadow-hi);transform:translateY(-3px)}
.tile-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile-title{display:flex;align-items:center;gap:12px}
.chip{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.chip.car{background:var(--c-car-soft);color:var(--c-car)}
.chip.cal{background:var(--c-cal-soft);color:var(--c-cal)}
.chip.bill{background:var(--c-bill-soft);color:var(--c-bill)}
.chip.bin{background:var(--c-bin-soft);color:var(--c-bin)}
.chip.bday{background:var(--c-bday-soft);color:var(--c-bday)}
.chip.cart{background:var(--ok-soft);color:var(--ok)}
.chip.priv{background:var(--c-bday-soft);color:var(--c-bday)}
.shop-add{display:grid;grid-template-columns:1fr 88px auto;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.shop-add button{min-width:52px;font-size:1.3rem}
.shop-list{display:grid;gap:6px}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:52px}
.shop-item .t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.shop-item .m{color:var(--muted);font-size:.85rem;white-space:nowrap}
.shop-item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.check{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none}
.shop-item.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.shop-item.done .check::after{content:"✓";font-weight:800}
.day-head{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 4px 0}
.src-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.connect{display:grid;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.connect h3{font-size:1rem}
.connect ol{margin:0;padding-left:20px;color:var(--muted);font-size:.88rem;display:grid;gap:4px}
.chip.idea{background:var(--warn-soft);color:var(--warn)}
.idea-card{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.idea-card.done{opacity:.6;box-shadow:none}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.idea-card .t{font-weight:800;overflow-wrap:anywhere}
.idea-card p{margin:0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;white-space:pre-line}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chips-row button{min-height:34px;padding:5px 12px;font-size:.8rem}
.chips-row button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.money{background:var(--ok-soft);color:var(--ok)}
.debtor{display:grid;gap:10px}
.debtor-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.chip.lend{background:var(--c-car-soft);color:var(--c-car)}
.tag-tracker{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:999px;padding:3px 9px}
.tag-tracker svg.i{width:13px;height:13px}
.chip.ablage{background:var(--sunken);color:var(--ink)}
.chip.fix{background:var(--c-fix-soft);color:var(--c-fix)}
.date-block.fix{background:var(--c-fix-soft);color:var(--c-fix)}
.ampel{display:inline-flex;gap:3px;padding:3px 5px;background:#14161C;border-radius:999px;flex:none}
.ampel i{width:9px;height:9px;border-radius:50%;background:#3A3E48;display:block}
.ampel i.on.r{background:#FF3B3B;box-shadow:0 0 6px #FF3B3B}
.ampel i.on.y{background:#FFC83D;box-shadow:0 0 6px #FFC83D}
.ampel i.on.g{background:#2FD27A;box-shadow:0 0 6px #2FD27A}
.ampel-row{border-left:5px solid var(--line)}
.ampel-row.ok{border-left-color:var(--ok)}
.ampel-row.warn{border-left-color:var(--warn)}
.ampel-row.crit{border-left-color:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.share-badge{min-height:28px;padding:3px 10px;font-size:.72rem;gap:5px;border-radius:999px;background:var(--sunken);border:none;color:var(--muted);margin-left:auto}
.share-badge svg.i{width:14px;height:14px}
.share-badge.partner{background:var(--c-fix-soft);color:var(--c-fix)}
.share-badge.alle{background:var(--ok-soft);color:var(--ok)}
.share-badge:hover{border:none;color:var(--ink)}
.tile-title{flex:1 0 auto;max-width:100%}
.tile-head{flex-wrap:wrap;row-gap:8px}
.tile-head .count{margin-left:auto}
.share-list{display:grid;gap:8px}
.share-row{display:grid;grid-template-columns:1fr minmax(0,260px);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunken)}
.share-row .t{font-weight:700}
.share-row select{background:var(--surface)}
@media (max-width:520px){.share-row{grid-template-columns:1fr}}
.notices{display:grid;gap:8px}
#app{display:grid;gap:20px}
.notice{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--ink);border:1px solid transparent;font-size:.86rem;line-height:1.3}
.notice svg.i{width:18px;height:18px}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice.info svg.i{color:var(--accent)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.crit{background:var(--crit-soft);border-color:var(--crit)}
.notice.warn svg.i{color:var(--warn)}
.notice.crit svg.i{color:var(--crit)}
.auth-card{max-width:440px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:grid;gap:16px;box-shadow:var(--shadow)}
.member{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--sunken)}
.member-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.member .tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.member .tiles-grid label{display:grid;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
.member select,.member input{background:var(--surface)}
.konto-group{display:grid;gap:10px}
.konto-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.konto-head h3{display:flex;align-items:center;gap:8px}
.amount{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bin-dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.bin-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.bin-badge svg.i{width:22px;height:22px}
.next-hl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sunken)}
.next-hl.soon{background:var(--warn-soft);color:var(--warn)}
.next-hl b{color:var(--ink)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.date-chip{font-size:.78rem;font-weight:700;background:var(--sunken);border-radius:8px;padding:3px 8px;color:var(--muted)}
.date-block.bday{background:var(--c-bday-soft);color:var(--c-bday)}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--sunken);border-radius:999px;justify-self:start;flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);min-height:38px}

.pill.warn{background:var(--warn-soft);color:var(--warn)}

function hinweise(){
  const out = [];

    const t = today(), m = new Date(t); m.setDate(m.getDate() + 1);
    const nx = muellNext();
    const heute = nx.filter(x => +x.d === +t).map(x => x.m.label || x.m.art);

    if (heute.length) out.push({ cls: "warn", icon: ICON.bin, href: "#muell", text: `<b>Heute Abfuhr:</b> ${esc([...new Set(heute)].join(" + "))} – bis 6 Uhr bereitstellen` });
    if (morgen.length) out.push({ cls: "crit", icon: ICON.bin, href: "#muell", text: `<b>Morgen Abfuhr:</b> ${esc([...new Set(morgen)].join(" + "))} – heute Abend rausstellen` });
  }
  if (visible("privattermine")) { const h0 = iso(today()); const heute = privAlle().filter(e => e.datum === h0); if (heute.length) out.push({ cls: "info", icon: ICON.priv, href: "#privattermine", text: `<b>Heute privat:</b> ${esc(heute.slice(0, 3).map(e => (e.zeit ? e.zeit + " " : "") + e.titel).join(" · "))}` }); }
  if (visible("forderungen")) { const ue = offeneFord().filter(f => fordStatus(f).cls === "crit"); if (ue.length) out.push({ cls: "crit", icon: ICON.money, href: "#forderungen", text: `<b>${ue.length} Zahlung${ue.length === 1 ? "" : "en"} überfällig:</b> ${esc([...new Set(ue.map(f => f.kunde))].join(", "))} – ${eur.format(ue.reduce((s,f) => s + offenBetrag(f), 0))}` }); }
  if (visible("ausleihe")) for (const a of offenAus()) { const s = ausStatus(a); if (s.cls === "crit" || s.cls === "warn") out.push({ cls: s.cls, icon: ICON.lend, href: "#ausleihe", text: `<b>${esc(a.gegenstand)}</b> ${esc(ausWer(a))}: ${esc(s.txt)}` }); }
  if (me.owner) { const p = members.filter(m => m.status === "pending").length; if (p) out.push({ cls: "warn", icon: ICON.people, href: "#", act: "share", text: `<b>${p} ${p === 1 ? "Person wartet" : "Personen warten"} auf Freigabe</b> – jetzt Kacheln freigeben` }); }
  if (visible("fahrzeuge")) {

    }
  }
  return out;
}
/* Neuigkeiten pro Person: neu freigegebene Kacheln und Änderungen anderer seit dem letzten Besuch */
const SEEN_KEY = "hehub-gesehen";
let seen = (() => { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch { return null; } })();
const firstVisitTs = Date.now();
const names = {}; let namesPending = false;
async function loadNames(ids){
  const need = ids.filter(i => i && !(i in names)); if (!need.length || namesPending) return;
  namesPending = true;
  try { const { data } = await sb.rpc("he_names"); (data || []).forEach(r => names[r.user_id] = r.name || ""); } catch {}
  need.forEach(i => { if (!(i in names)) names[i] = ""; });
  namesPending = false; render();
}
const itemTitle = it => it.kind === "fahrzeug" ? (it.kennzeichen || it.name) : it.kind === "termin" ? it.titel : it.kind === "beleg" ? (it.haendler || "Rechnung") : it.kind === "fix" ? it.name : it.kind === "muell" ? it.art : it.kind === "geburtstag" ? it.name : it.kind === "ausleihe" ? it.gegenstand : it.kind === "forderung" ? `${it.kunde} – ${it.baustelle}` : it.kind === "idee" ? it.titel : it.kind === "einkauf" ? it.name : it.kind === "privtermin" ? it.titel : it.kind === "kalquelle" ? (it.name || "Kalender") : "Eintrag";
function neuigkeiten(){
  if (S.mode !== "db") return { tiles: [], changes: [] };
  const vis = TILES.map(([k]) => k).filter(visible);
  const since = seen?.ts ?? firstVisitTs;
  const tiles = me.owner ? [] : vis.filter(k => !(seen?.tiles || []).includes(k));
  const changes = S.items.filter(i => visible(tileOf(i)) && i.von && i.von !== uid && (i.geaendert || 0) > since).sort((a,b) => b.geaendert - a.geaendert);
  return { tiles, changes };
}
function markSeen(){

  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch {}
  render();

function neuigkeitenHtml(){

  ];

}

async function saveShare(form){
  const fd = new FormData(form);
  for (const m of members) {

    const status = fd.get("status-" + m.user_id) || m.status;
    const tiles = m.role === "admin" ? m.tiles : Object.fromEntries(TILES.map(([k]) => [k, fd.get(`t-${m.user_id}-${k}`) || "none"]).filter(([,v]) => v !== "none"));

/* ---------- Private Termine + Handy-Kalender ---------- */
const KAL = { events: [], errors: [], loadedAt: 0, loading: false };
let calToken = null;
const kalQuellen = () => ofKind("kalquelle");
async function loadKal(force){
  if (!visible("privattermine") || KAL.loading) return;
  const urls = kalQuellen().map(q => q.url).filter(Boolean);
  if (!urls.length) { KAL.events = []; KAL.errors = []; return; }
  if (!force && Date.now() - KAL.loadedAt < 5 * 60000) return;
  KAL.loading = true;
  try {
    const { data, error } = await sb.functions.invoke("he-kal-import", { body: { urls } });
    if (error) throw error;
    KAL.events = []; KAL.errors = [];
    for (const r of data.results || []) {
      const q = kalQuellen().find(x => x.url === r.url);
      if (r.error) KAL.errors.push({ url: r.url, error: r.error, name: q?.name });
      else { (r.events || []).forEach(e => KAL.events.push({ ...e, quelle: q?.name || r.name || "Handy-Kalender" })); if (q && r.name && !q.name) saveItem({ ...q, name: r.name }).catch(() => {}); }
    }
    KAL.loadedAt = Date.now();
  } catch { KAL.errors = [{ error: "failed" }]; }
  KAL.loading = false; KAL.loadedAt = Date.now(); render();
}
function privAlle(){
  const t0 = iso(today());
  const eigene = ofKind("privtermin").map(t => ({ datum: t.datum, zeit: t.zeit || "", bisZeit: t.zeitBis || "", titel: t.titel, ort: t.ort || "", notiz: t.notiz || "", id: t.id, eigen: true }));
  return [...eigene, ...KAL.events].filter(e => e.datum >= t0).sort((a,b) => (a.datum + (a.zeit || "00:00")).localeCompare(b.datum + (b.zeit || "00:00")));
}
const tagName = d => { const x = parseDate(d); const n = Math.round((x - today())/86400000); return (n === 0 ? "Heute" : n === 1 ? "Morgen" : x.toLocaleDateString("de-DE", { weekday: "long" })) + ", " + x.toLocaleDateString("de-DE", { day: "numeric", month: "long" }); };

/* ---------- Ideen ---------- */
const IDEE_KAT = ["Haus & Wohnung","Garten","Urlaub & Ausflüge","Geschenke","Projekte & Basteln","Firma H&E Tools","Sonstiges"];
const IDEE_ST = { neu:"Neu", geplant:"Geplant", erledigt:"Umgesetzt" };
let ideeKat = "", ideeFilter = "offen", ideeQ = "";
const ideenOffen = () => ofKind("idee").filter(i => i.status !== "erledigt");
function ideeRows(){
  const q = ideeQ.trim().toLowerCase(); const w = canWrite("ideen");
  const list = ofKind("idee").filter(i => (ideeFilter === "offen" ? i.status !== "erledigt" : i.status === "erledigt") && (!ideeKat || i.kategorie === ideeKat) && (!q || [i.titel, i.notiz, i.kategorie].join(" ").toLowerCase().includes(q)))
    .sort((a,b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (a.status === "geplant" ? -1 : 0) - (b.status === "geplant" ? -1 : 0) || (b.geaendert || 0) - (a.geaendert || 0));
  if (!list.length) return `<div class="empty">${ofKind("idee").length ? "Keine Idee passt zum Filter." : "Noch keine Ideen. Schreib die erste auf – egal wie klein."}</div>`;
  return `<div class="idea-grid">${list.map(i => `
    <div class="idea-card ${i.status === "erledigt" ? "done" : ""}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><span class="t">${i.fav ? "★ " : ""}${esc(i.titel)}</span>${w ? `<button class="ghost" style="min-height:32px;padding:2px 8px" data-act="idee-fav" data-id="${i.id}" aria-label="${i.fav ? "Favorit entfernen" : "Als Favorit markieren"}">${i.fav ? "★" : "☆"}</button>` : ""}</div>
      ${i.notiz ? `<p>${esc(i.notiz)}</p>` : ""}
      ${i.link ? `<a href="${esc(/^https?:\/\//.test(i.link) ? i.link : "https://" + i.link)}" target="_blank" rel="noopener" style="font-size:.85rem;color:var(--accent);overflow-wrap:anywhere">${esc(i.link)}</a>` : ""}
      <div class="chips-row"><span class="pill neutral">${esc(i.kategorie || "Sonstiges")}</span><span class="pill ${i.status === "geplant" ? "warn" : i.status === "erledigt" ? "ok" : "neutral"}">${IDEE_ST[i.status || "neu"]}</span>${i.kosten ? `<span class="pill neutral">ca. ${esc(i.kosten)}</span>` : ""}</div>
      ${w ? `<div class="toolbar">${i.status === "erledigt" ? `<button data-act="idee-status" data-s="neu" data-id="${i.id}">Wieder öffnen</button>` : `${i.status !== "geplant" ? `<button data-act="idee-status" data-s="geplant" data-id="${i.id}">Planen</button>` : ""}<button class="primary" data-act="idee-status" data-s="erledigt" data-id="${i.id}">Umgesetzt</button>`}<button class="ghost" data-act="edit" data-id="${i.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${i.id}">Löschen</button></div>` : ""}
    </div>`).join("")}</div>`;
}
function viewIdeen(){
  const w = canWrite("ideen");
  const kats = [...new Set(ofKind("idee").map(i => i.kategorie).filter(Boolean))];
  return `<section style="display:grid;gap:14px">
    <div class="view-head">${backBtn}${w ? `<button class="primary" data-act="new-idee">${ICON.plus}Idee notieren</button>` : ""}</div>
    <h2 class="page-title">Ideen</h2>
    <div class="seg" role="tablist">${[["offen",`Offen (${ideenOffen().length})`],["erledigt","Umgesetzt"]].map(([k,l]) => `<button role="tab" class="${ideeFilter===k?"on":""}" aria-selected="${ideeFilter===k}" data-act="idee-filter" data-f="${k}">${l}</button>`).join("")}</div>
    ${kats.length > 1 ? `<div class="chips-row"><button class="${!ideeKat ? "on" : ""}" data-act="idee-kat" data-k="">Alle</button>${kats.map(k => `<button class="${ideeKat === k ? "on" : ""}" data-act="idee-kat" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    <input id="ideeQ" type="search" placeholder="Ideen durchsuchen …" value="${esc(ideeQ)}" style="max-width:360px">
    <div id="ideeList">${ideeRows()}</div>
  </section>`;
}
function formIdee(i = {}){
  openModal(`<form id="frm" data-kind="idee" data-id="${i.id||""}" style="display:grid;gap:14px">${head(i.id ? "Idee bearbeiten" : "Neue Idee")}
    <div class="fields">
      <label class="f full">Idee<input id="id-titel" name="titel" required placeholder="z. B. Hochbeet am Carport" value="${esc(i.titel)}"></label>
      <label class="f full">Beschreibung<textarea id="id-notiz" name="notiz" placeholder="Details, Maße, Gedanken …">${esc(i.notiz)}</textarea></label>
      <label class="f">Kategorie<select id="id-kat" name="kategorie">${IDEE_KAT.map(k => `<option ${k === (i.kategorie || "Sonstiges") ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>
      <label class="f">Status<select id="id-st" name="status">${Object.entries(IDEE_ST).map(([v,l]) => `<option value="${v}" ${v === (i.status || "neu") ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">Kosten ca. (optional)<input id="id-kosten" name="kosten" placeholder="z. B. 300 €" value="${esc(i.kosten)}"></label>
      <label class="f">Link (optional)<input id="id-link" name="link" inputmode="url" placeholder="Shop, Anleitung …" value="${esc(i.link)}"></label>
    </div>${foot()}</form>`);
}

/* ---------- Offene Beträge (Baustellen) ---------- */
const offenBetrag = f => Math.max(0, Math.round(((Number(f.betrag) || 0) - (Number(f.bezahlt) || 0)) * 100) / 100);
const offeneFord = () => ofKind("forderung").filter(f => offenBetrag(f) > 0).sort((a,b) => String(a.faellig || a.datum || "9999").localeCompare(String(b.faellig || b.datum || "9999")));
function fordStatus(f){
  if (offenBetrag(f) <= 0) return { cls: "neutral", txt: f.bezahltAm ? `Bezahlt am ${fmtDate(f.bezahltAm)}` : "Bezahlt" };
  const d = parseDate(f.faellig); if (!d) return { cls: "ok", txt: "Ohne Fälligkeit" };
  const n = Math.round((d - today())/86400000);
  if (n < 0) return { cls: "crit", txt: `Überfällig seit ${-n} Tag${n === -1 ? "" : "en"}` };
  if (n <= 7) return { cls: "warn", txt: n === 0 ? "Heute fällig" : `Fällig in ${n} Tag${n === 1 ? "" : "en"}` };
  return { cls: "ok", txt: `Fällig am ${fmtDate(f.faellig)}` };
}
let fordFilter = "offen";
function viewForderungen(){
  const w = canWrite("forderungen");
  const offen = offeneFord();
  const summe = offen.reduce((s,f) => s + offenBetrag(f), 0);
  const ueber = offen.filter(f => fordStatus(f).cls === "crit");
  const row = f => { const st = fordStatus(f); const rest = offenBetrag(f); return `
    <div class="row ${rest > 0 ? "ampel-row " + st.cls : "past"}" style="grid-template-columns:1fr auto">
      <div class="main"><span class="t">${esc(f.baustelle || "Baustelle")}${f.rechnungsnr ? ` <span class="muted" style="font-weight:500">· Nr. ${esc(f.rechnungsnr)}</span>` : ""}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${st.cls}">${esc(st.txt)}</span>${Number(f.bezahlt) > 0 && rest > 0 ? `<span class="muted" style="font-size:.85rem">${eur.format(f.bezahlt)} von ${eur.format(f.betrag)} bezahlt</span>` : ""}</div>
        <span class="muted" style="font-size:.85rem">Rechnung vom ${fmtDate(f.datum)}${f.notiz ? " · " + esc(f.notiz) : ""}</span>
        ${w ? `<div class="toolbar" style="margin-top:4px">${rest > 0 ? `<button class="primary" data-act="ford-zahlung" data-id="${f.id}">Zahlung erfassen</button>` : `<button data-act="ford-offen" data-id="${f.id}">Wieder öffnen</button>`}<button data-act="edit" data-id="${f.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${f.id}">Löschen</button></div>` : ""}
      </div>
      <span class="amount" style="align-self:start;font-size:1.05rem">${eur.format(rest > 0 ? rest : f.betrag)}</span>
    </div>`; };
  let body;
  if (fordFilter === "offen") {
    const wer = [...new Set(offen.map(f => f.kunde || "Ohne Namen"))].map(k => ({ k, items: offen.filter(f => (f.kunde || "Ohne Namen") === k) })).map(g => ({ ...g, sum: g.items.reduce((s,f) => s + offenBetrag(f), 0) })).sort((a,b) => b.sum - a.sum);
    body = wer.length ? wer.map(g => `<div class="debtor"><div class="debtor-head"><h3>${esc(g.k)}</h3><span class="amount" style="color:var(--crit)">${eur.format(g.sum)}</span></div><div class="list">${g.items.map(row).join("")}</div></div>`).join("")
      : `<div class="empty">Niemand schuldet dir gerade Geld.</div>`;
  } else {
    const bez = ofKind("forderung").filter(f => offenBetrag(f) <= 0).sort((a,b) => String(b.bezahltAm || "").localeCompare(String(a.bezahltAm || "")));
    body = bez.length ? `<div class="list">${bez.map(f => row(f).replace('<span class="t">', `<span class="t">${esc(f.kunde || "")} · `)).join("")}</div>` : `<div class="empty">Noch nichts bezahlt.</div>`;
  }
  return `<section style="display:grid;gap:16px">
    <div class="view-head">${backBtn}${w ? `<button class="primary" data-act="new-forderung">${ICON.plus}Betrag eintragen</button>` : ""}</div>
    <h2 class="page-title">Offene Beträge</h2>
    <div class="sums">
      <div class="sum total"><span class="k">Noch offen</span><span class="v num">${eur.format(summe)}</span></div>
      <div class="sum"><span class="k">Schuldner</span><span class="v num">${new Set(offen.map(f => f.kunde || "")).size}</span></div>
      <div class="sum" ${ueber.length ? 'style="border-color:var(--crit)"' : ""}><span class="k">Überfällig</span><span class="v num" ${ueber.length ? 'style="color:var(--crit)"' : ""}>${eur.format(ueber.reduce((s,f) => s + offenBetrag(f), 0))}</span></div>
    </div>
    <div class="seg" role="tablist">${[["offen",`Offen (${offen.length})`],["bezahlt","Bezahlt"]].map(([k,l]) => `<button role="tab" class="${fordFilter===k?"on":""}" aria-selected="${fordFilter===k}" data-act="ford-filter" data-f="${k}">${l}</button>`).join("")}</div>
    ${body}
  </section>`;
}
function formForderung(f = {}){
  const kunden = [...new Set(ofKind("forderung").map(x => x.kunde).filter(Boolean))];
  openModal(`<form id="frm" data-kind="forderung" data-id="${f.id||""}" style="display:grid;gap:14px">${head(f.id ? "Betrag bearbeiten" : "Offenen Betrag eintragen")}
    <div class="fields">
      <label class="f">Wer schuldet?<input id="fo-kunde" name="kunde" list="kundenList" required placeholder="Kunde / Name" value="${esc(f.kunde)}"><datalist id="kundenList">${kunden.map(k => `<option value="${esc(k)}">`).join("")}</datalist></label>
      <label class="f">Baustelle / Auftrag<input id="fo-bau" name="baustelle" required placeholder="z. B. Aushub Garage Müller" value="${esc(f.baustelle)}"></label>
      <label class="f">Betrag (€)<input id="fo-betrag" name="betrag" inputmode="decimal" required placeholder="0,00" value="${f.betrag != null ? esc(String(f.betrag).replace(".", ",")) : ""}"></label>
      <label class="f">Schon bezahlt (€)<input id="fo-bez" name="bezahlt" inputmode="decimal" placeholder="0,00" value="${Number(f.bezahlt) ? esc(String(f.bezahlt).replace(".", ",")) : ""}"></label>
      <label class="f">Rechnungsdatum<input id="fo-datum" name="datum" type="date" required value="${esc(f.datum || iso(today()))}"></label>
      <label class="f">Fällig am<input id="fo-faellig" name="faellig" type="date" value="${esc(f.faellig || (() => { const d = parseDate(f.datum) || today(); d.setDate(d.getDate() + 14); return iso(d); })())}"></label>
      <label class="f">Rechnungsnummer (optional)<input id="fo-nr" name="rechnungsnr" value="${esc(f.rechnungsnr)}"></label>
      <label class="f">Notiz<input id="fo-notiz" name="notiz" placeholder="Mahnung, Absprache …" value="${esc(f.notiz)}"></label>
    </div>${foot()}</form>`);
}
function formZahlung(f){
  openModal(`<form id="zahlFrm" data-id="${f.id}" style="display:grid;gap:14px">${head("Zahlung erfassen")}
    <p class="muted" style="margin:0">${esc(f.kunde)} · ${esc(f.baustelle)} – noch offen: <b>${eur.format(offenBetrag(f))}</b></p>
    <div class="fields">
      <label class="f">Betrag (€)<input id="za-betrag" name="betrag" inputmode="decimal" required value="${esc(String(offenBetrag(f)).replace(".", ","))}"></label>
      <label class="f">Bezahlt am<input id="za-datum" name="datum" type="date" required value="${iso(today())}"></label>
    </div>
    <div class="sheet-foot"><button class="ghost" data-act="close">Abbrechen</button><button class="primary" type="submit" id="zaSave">Speichern</button></div></form>`);
}

/* ---------- Ausleihliste ---------- */
const offenAus = () => ofKind("ausleihe").filter(a => !a.zurueckAm).sort((a,b) => String(a.bis || "9999").localeCompare(String(b.bis || "9999")));
function ausStatus(a){
  if (a.zurueckAm) return { cls: "neutral", txt: `Zurück am ${fmtDate(a.zurueckAm)}` };
  const b = parseDate(a.bis); if (!b) return { cls: "ok", txt: "Ohne Rückgabedatum" };
  const n = Math.round((b - today())/86400000);
  if (n < 0) return { cls: "crit", txt: `Überfällig seit ${-n} Tag${n === -1 ? "" : "en"}` };
  if (n <= 3) return { cls: "warn", txt: n === 0 ? "Heute zurück" : n === 1 ? "Morgen zurück" : `In ${n} Tagen zurück` };
  return { cls: "ok", txt: `Zurück bis ${fmtDate(a.bis)}` };
}
const ausWer = a => a.richtung === "geliehen" ? `von ${a.person || "–"}` : `an ${a.person || "–"}`;
let ausFilter = "offen";
function viewAusleihe(){
  const all = ofKind("ausleihe");
  const list = (ausFilter === "offen" ? offenAus() : all.filter(a => a.zurueckAm).sort((a,b) => String(b.zurueckAm).localeCompare(String(a.zurueckAm))));
  const w = canWrite("ausleihe");
  return `<section style="display:grid;gap:16px">
    <div class="view-head">${backBtn}${w ? `<button class="primary" data-act="new-ausleihe">${ICON.plus}Ausleihe eintragen</button>` : ""}</div>
    <h2 class="page-title">Ausleihliste</h2>
    <div class="seg" role="tablist">${[["offen",`Offen (${offenAus().length})`],["zurueck","Zurückgegeben"]].map(([k,l]) => `<button role="tab" class="${ausFilter===k?"on":""}" aria-selected="${ausFilter===k}" data-act="aus-filter" data-f="${k}">${l}</button>`).join("")}</div>
    ${list.length ? `<div class="list">${list.map(a => { const s = ausStatus(a); return `
      <div class="row ${a.zurueckAm ? "past" : "ampel-row " + s.cls}" style="grid-template-columns:auto 1fr">
        <span class="chip lend" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center">${ICON.lend}</span>
        <div class="main"><span class="t">${esc(a.gegenstand)}</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${a.richtung === "geliehen" ? "neutral" : "neutral"}">${a.richtung === "geliehen" ? "Ausgeliehen" : "Verliehen"} ${esc(ausWer(a))}</span><span class="pill ${s.cls}">${esc(s.txt)}</span>${a.tracker ? `<span class="tag-tracker">${ICON.tag}${esc(a.tracker)}</span>` : ""}</div>
          <span class="muted" style="font-size:.85rem">Seit ${fmtDate(a.seit)}${a.notiz ? " · " + esc(a.notiz) : ""}</span>
          ${w ? `<div class="toolbar" style="margin-top:4px">${a.zurueckAm ? `<button data-act="aus-offen" data-id="${a.id}">Wieder öffnen</button>` : `<button class="primary" data-act="aus-zurueck" data-id="${a.id}">Zurückgegeben</button>`}<button data-act="edit" data-id="${a.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${a.id}">Löschen</button></div>` : ""}
        </div>
      </div>`; }).join("")}</div>`
      : `<div class="empty">${ausFilter === "offen" ? "Gerade ist nichts verliehen oder ausgeliehen." : "Noch nichts zurückgegeben."}</div>`}
    <p class="muted" style="margin:0;font-size:.82rem">Tracker (z. B. AirTag): Den Standort kann die App nicht abrufen – Apple bietet dafür keine Schnittstelle. Du kannst aber notieren, welcher Tracker am Gegenstand hängt, und ihn in der „Wo ist?“-App suchen.</p>
  </section>`;
}
function formAusleihe(a = {}){
  openModal(`<form id="frm" data-kind="ausleihe" data-id="${a.id||""}" style="display:grid;gap:14px">${head(a.id ? "Ausleihe bearbeiten" : "Ausleihe eintragen")}
    <div class="fields">
      <label class="f full">Was?<input id="au-was" name="gegenstand" required placeholder="z. B. Rüttelplatte, Anhänger, Buch" value="${esc(a.gegenstand)}"></label>
      <label class="f">Richtung<select id="au-ri" name="richtung"><option value="verliehen" ${a.richtung !== "geliehen" ? "selected" : ""}>Ich verleihe</option><option value="geliehen" ${a.richtung === "geliehen" ? "selected" : ""}>Ich leihe aus</option></select></label>
      <label class="f">Person<input id="au-person" name="person" required placeholder="Name" value="${esc(a.person)}"></label>
      <label class="f">Seit<input id="au-seit" name="seit" type="date" required value="${esc(a.seit || iso(today()))}"></label>
      <label class="f">Zurück bis (optional)<input id="au-bis" name="bis" type="date" value="${esc(a.bis)}"></label>
      <label class="f full">Tracker / AirTag (optional)<input id="au-tag" name="tracker" placeholder="z. B. AirTag „Rüttelplatte“" value="${esc(a.tracker)}"></label>
      <label class="f full">Notiz<input id="au-notiz" name="notiz" placeholder="Zustand, Zubehör …" value="${esc(a.notiz)}"></label>
    </div>${foot()}</form>`);
}

function viewGeburtstage(){
  const list = bdaySorted();
  return `<section style="display:grid;gap:16px">
    <div class="view-head">${backBtn}<button class="primary" data-act="new-geburtstag">${ICON.plus}Geburtstag hinzufügen</button></div>
    <h2 class="page-title">Geburtstage</h2>
    ${list.length ? `<div class="list">${list.map(({g,n}) => `
      <div class="row"><div class="date-block bday"><div class="d">${n.d.getDate()}</div><div class="m">${MONATE[n.d.getMonth()]}</div></div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${n.days<=7?"warn":"neutral"}">${daysText(n.days)}</span>${n.alter!=null?`<span class="muted" style="font-size:.88rem">wird ${n.alter} · geboren ${fmtDate(g.datum)}</span>`:""}${g.beziehung?`<span class="muted" style="font-size:.88rem">${esc(g.beziehung)}</span>`:""}</div>
          ${g.notiz?`<span class="muted" style="font-size:.9rem;overflow-wrap:anywhere">🎁 ${esc(g.notiz)}</span>`:""}</div>

const backBtn = `<a class="btn ghost back" href="#">${ICON.back}Übersicht</a>`;

function viewFahrzeuge(){
  const fz = ofKind("fahrzeug").slice().sort((a,b) => tuevInfo(a.tuev).months - tuevInfo(b.tuev).months);
  return `<section style="display:grid;gap:16px">
    <div class="view-head">${backBtn}<button class="primary" data-act="new-fahrzeug">${ICON.plus}Fahrzeug hinzufügen</button></div>
    <h2 class="page-title">Fahrzeuge</h2>
    ${fz.length ? `<div class="list">${fz.map(f => { const t = tuevInfo(f.tuev); return `
      <div class="row">${plakette(f.tuev,56)}
        <div class="main"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${plate(f.kennzeichen)}<span class="t">${esc(f.name)}</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${t.cls}">${esc(t.label)}</span>${f.km?`<span class="muted num" style="font-size:.85rem">${Number(f.km).toLocaleString("de-DE")} km</span>`:""}</div>
          ${f.notiz?`<div class="muted" style="font-size:.9rem;overflow-wrap:anywhere">${esc(f.notiz)}</div>`:""}</div>
        <div class="acts"><button data-act="edit" data-id="${f.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${f.id}">Löschen</button></div>
      </div>`; }).join("")}</div>`
      : `<div class="empty">Noch keine Fahrzeuge. Füge eins hinzu – Kennzeichen, Bezeichnung und den Monat der nächsten Hauptuntersuchung.</div>`}
  </section>`;
}

function viewTermine(){
  const all = sortedTermine(); const t0 = today();
  const fut = all.filter(t => (parseDate(t.datum)||0) >= t0), past = all.filter(t => (parseDate(t.datum)||0) < t0).reverse();
  const row = (t, isPast) => { const d = parseDate(t.datum) || new Date(); return `
    <div class="row ${isPast?"past":""}"><div class="date-block"><div class="d">${d.getDate()}</div><div class="m">${MONATE[d.getMonth()]}</div></div>
      <div class="main"><span class="t">${esc(t.titel)}</span><span class="muted" style="font-size:.9rem">${fmtDate(t.datum)}${t.zeit?" · "+esc(t.zeit)+" Uhr":""} · ${dayLabel(t.datum)}${t.ort?" · "+esc(t.ort):""}</span>
      ${t.notiz?`<span class="muted" style="font-size:.9rem;overflow-wrap:anywhere">${esc(t.notiz)}</span>`:""}</div>
      <div class="acts"><button data-act="edit" data-id="${t.id}">Bearbeiten</button><button class="ghost danger" data-act="del" data-id="${t.id}">Löschen</button></div></div>`; };
  return `<section style="display:grid;gap:16px">

async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

async function onPhoto(file){
  const st = $("#bl-status"), prev = $("#bl-prev");
  st.className = "scan-status"; st.textContent = "Foto wird vorbereitet …";
  let blob;
  try { blob = await shrink(file); } catch { st.className = "scan-status warn"; st.textContent = "Dieses Bildformat kann nicht gelesen werden. Bitte ein JPG oder PNG wählen."; return; }
  if (!pending) return;
  pending.blob = blob;
  prev.src = URL.createObjectURL(blob); prev.hidden = false;
  if (!pending.canScan) { st.className = "scan-status"; st.textContent = "Foto übernommen. Bitte Betrag und Datum eintragen."; return; }
  st.textContent = "Rechnung wird gelesen … (dauert meist 10–30 Sekunden)";
  const ctl = new AbortController(); pending.ctl = ctl;
  const scanBereich = $("#bl-bereich")?.value || "H&E Tools";
  try {
    const r = await sample.json(
      `Das Bild zeigt eine deutsche Rechnung oder einen Kassenbon. Lies die Angaben aus.
Antworte NUR mit einem JSON-Objekt dieser Form:
{"betrag": 123.45, "datum": "YYYY-MM-DD", "haendler": "Name des Ausstellers", "beschreibung": "kurze Beschreibung der Leistung, max. 60 Zeichen", "kategorie": "eine aus der Liste", "arbeitskosten": 0, "mwst": 19.00}
- betrag: Endbetrag brutto in Euro als Zahl (Punkt als Dezimaltrenner). Falls unlesbar: null.
- datum: Rechnungsdatum; falls unlesbar: null.
- mwst: Summe der ausgewiesenen Mehrwertsteuer in Euro (alle Steuersätze zusammen); falls nicht ausgewiesen: null.
- arbeitskosten: ausgewiesener Lohn-/Arbeitsanteil brutto (wichtig für §35a), sonst 0.
- kategorie: genau eine aus ${JSON.stringify(katsFor(scanBereich))}.${scanBereich === ABLAGE ? " Es ist ein privater Kaufbeleg zur Ablage (z. B. für Garantie); beschreibung = gekaufter Artikel." : ""}${scanBereich === "H&E Tools" ? " Es ist ein Firmenbeleg der Firma H&E Tools – ordne nach betrieblicher Verwendung zu." : ""} Handwerker-Rechnungen (Reparatur, Wartung, Renovierung) → "Handwerkerleistungen §35a"; Reinigung, Gartenpflege, Haushaltshilfe → "Haushaltsnahe Dienstleistungen §35a"; Arbeitsmittel, Fachliteratur, Fortbildung → "Werbungskosten (Beruf)"; Spenden, Versicherungen → "Sonderausgaben"; Arzt, Apotheke, Brille → "Außergewöhnliche Belastungen"; Werkstatt, Tanken, TÜV → "Fahrzeug".`,
      { images: blob, signal: ctl.signal });
    if (!pending || pending.ctl !== ctl) return;
    const set = (sel, v) => { const el = $(sel); if (el && v != null && v !== "") el.value = v; };
    const amt = parseAmount(r?.betrag);
    if (isFinite(amt)) set("#bl-betrag", amt.toFixed(2).replace(".", ","));
    if (/^\d{4}-\d{2}-\d{2}$/.test(r?.datum || "")) set("#bl-datum", r.datum);
    set("#bl-haendler", r?.haendler);
    let beschr = r?.beschreibung || "";
    const ak = parseAmount(r?.arbeitskosten);
    if (isFinite(ak) && ak > 0) beschr = (beschr ? beschr + ", " : "") + "Arbeitskosten " + eur.format(ak);
    set("#bl-beschr", beschr);
    if (katsFor($("#bl-bereich")?.value).includes(r?.kategorie)) set("#bl-kat", r.kategorie);
    const mw = parseAmount(r?.mwst);
    if (isFinite(mw) && mw > 0) set("#bl-mwst", mw.toFixed(2).replace(".", ","));
    st.className = isFinite(amt) ? "scan-status ok" : "scan-status warn";
    st.textContent = isFinite(amt) ? `Erkannt: ${eur.format(amt)}. Bitte kurz prüfen und speichern.` : "Der Betrag war nicht lesbar. Bitte selbst eintragen.";
  } catch (e) {
    if (e?.code === "cancelled") return;
    st.className = "scan-status warn";
    st.textContent = e?.code === "no_api_key" ? "Das automatische Auslesen ist noch nicht eingerichtet (API-Key fehlt). Bitte Betrag selbst eintragen."
      : e?.code === "forbidden" ? "Du darfst in dieser Kachel nichts hinzufügen."
      : e?.code === "not_granted" ? "Auslesen wurde nicht erlaubt. Bitte Betrag selbst eintragen."
      : e?.code === "rate_limited" ? "Gerade zu viele Anfragen. Bitte Betrag selbst eintragen oder gleich ein neues Foto wählen."
      : "Die Rechnung konnte nicht ausgelesen werden. Bitte Betrag selbst eintragen.";
  }
}

async function submitForm(form){
  const kind = form.dataset.kind, id = form.dataset.id || undefined;
  const fd = Object.fromEntries(new FormData(form).entries());
  const old = id ? S.items.find(i => i.id === id) || {} : {};
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Speichert …";
  try {
    let obj;
    if (kind === "fahrzeug") obj = { ...old, kind, kennzeichen: fd.kennzeichen.trim().toUpperCase(), name: fd.name.trim(), tuev: fd.tuev || "", km: fd.km ? parseInt(fd.km.replace(/\D/g,""),10) || "" : "", notiz: fd.notiz.trim() };
    else if (kind === "privtermin") obj = { ...old, kind, titel: fd.titel.trim(), datum: fd.datum, zeit: fd.zeit || "", zeitBis: fd.zeitBis || "", ort: fd.ort.trim(), notiz: fd.notiz.trim() };
    else if (kind === "idee") obj = { ...old, kind, titel: fd.titel.trim(), notiz: fd.notiz.trim(), kategorie: fd.kategorie, status: fd.status, kosten: fd.kosten.trim(), link: fd.link.trim(), fav: !!old.fav };
    else if (kind === "forderung") {
      const betrag = parseAmount(fd.betrag), bez = fd.bezahlt ? parseAmount(fd.bezahlt) : 0;
      if (!isFinite(betrag)) { btn.disabled = false; btn.textContent = "Speichern"; $("#fo-betrag").focus(); toast("Bitte einen gültigen Betrag eingeben, z. B. 1.250,00"); return; }
      const bezahlt = isFinite(bez) ? Math.round(bez*100)/100 : 0;
      obj = { ...old, kind, kunde: fd.kunde.trim(), baustelle: fd.baustelle.trim(), betrag: Math.round(betrag*100)/100, bezahlt, datum: fd.datum, faellig: fd.faellig || "", rechnungsnr: fd.rechnungsnr.trim(), notiz: fd.notiz.trim(), bezahltAm: bezahlt >= betrag ? (old.bezahltAm || iso(today())) : "" };
    }
    else if (kind === "ausleihe") obj = { ...old, kind, gegenstand: fd.gegenstand.trim(), richtung: fd.richtung, person: fd.person.trim(), seit: fd.seit, bis: fd.bis || "", tracker: fd.tracker.trim(), notiz: fd.notiz.trim(), zurueckAm: old.zurueckAm || "" };
    else if (kind === "fix") {
      const betrag = parseAmount(fd.betrag);
      if (!isFinite(betrag)) { btn.disabled = false; btn.textContent = "Speichern"; $("#fx-betrag").focus(); toast("Bitte einen gültigen Betrag eingeben, z. B. 850,00"); return; }
      obj = { ...old, kind, typ: fd.typ, name: fd.name.trim(), betrag: Math.round(betrag*100)/100, rhythmus: Number(fd.rhythmus)||1, datum: fd.datum, konto: fd.konto.trim(), anbieter: fd.anbieter.trim(), vertragsnr: fd.vertragsnr.trim(), notiz: fd.notiz.trim() };
    }
    else if (kind === "muell") obj = { ...old, kind, art: fd.art, datum: fd.datum, rhythmus: Number(fd.rhythmus)||0, notiz: fd.notiz.trim() };
    else if (kind === "geburtstag") obj = { ...old, kind, name: fd.name.trim(), beziehung: fd.beziehung.trim(), datum: fd.datum, jahrUnbekannt: !!fd.jahrUnbekannt, notiz: fd.notiz.trim() };
    else if (kind === "termin") obj = { ...old, kind, titel: fd.titel.trim(), datum: fd.datum, zeit: fd.zeit || "", ort: fd.ort.trim(), notiz: fd.notiz.trim() };
    else {
      const betrag = parseAmount(fd.betrag);
      if (!isFinite(betrag)) { btn.disabled = false; btn.textContent = "Speichern"; $("#bl-betrag").focus(); toast("Bitte einen gültigen Betrag eingeben, z. B. 49,90"); return; }
      const mw = parseAmount(fd.mwst);
      obj = { ...old, kind, bereich: fd.bereich || "H&E Tools", betrag: Math.round(betrag*100)/100, mwst: isFinite(mw) ? Math.round(mw*100)/100 : "", datum: fd.datum, haendler: fd.haendler.trim(), kategorie: fd.kategorie, beschreibung: fd.beschreibung.trim(), garantie: fd.bereich === ABLAGE ? (fd.garantie || "") : (old.garantie || "") };
      if (pending?.blob && assets) {
        btn.textContent = "Foto wird gespeichert …";
        try { const a = await assets.upload(pending.blob, tileOf(obj)); obj.assetId = a.id; }
        catch { toast("Foto konnte nicht gespeichert werden – Beleg ohne Foto gesichert."); }
      }
    }
    delete obj.id; delete obj.geaendert;
    await saveItem({ id, ...obj });
    closeModal(); toast("Gespeichert");
    if (kind === "beleg" && obj.datum) { belegJahr = Number(obj.datum.slice(0,4)) || belegJahr; if (obj.bereich !== ABLAGE) belegBereich = "H&E Tools"; render(); }
  } catch (e) {
    btn.disabled = false; btn.textContent = "Speichern";
    toast("Speichern hat nicht geklappt. Bitte erneut versuchen.");
  }
}

function confirmDelete(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  const what = it.kind === "kalquelle" ? `die Verbindung zu „${it.name || "Handy-Kalender"}“` : it.kind === "privtermin" ? `den Termin „${it.titel}“` : it.kind === "einkauf" ? `„${it.name}“` : it.kind === "idee" ? `die Idee „${it.titel}“` : it.kind === "forderung" ? `den Betrag ${eur.format(it.betrag||0)} von ${it.kunde}` : it.kind === "ausleihe" ? `„${it.gegenstand}“ aus der Ausleihliste` : it.kind === "fix" ? `die Zahlung „${it.name}“` : it.kind === "muell" ? `die Tonne „${it.art}“` : it.kind === "geburtstag" ? `den Geburtstag von ${it.name}` : it.kind === "fahrzeug" ? `das Fahrzeug ${it.kennzeichen}` : it.kind === "termin" ? `den Termin „${it.titel}“` : `die Rechnung von ${it.haendler || "–"} über ${eur.format(it.betrag||0)}`;
  openModal(`${head("Löschen?")}<p style="margin:0">Möchtest du ${esc(what)} wirklich löschen? Das lässt sich nicht rückgängig machen.</p>
    <div class="sheet-foot"><button class="ghost" data-act="close">Abbrechen</button><button class="primary" style="background:var(--crit);border-color:var(--crit)" data-act="del-yes" data-id="${id}">Löschen</button></div>`);
}

async function exportCsv(){
  const list = belegeJahr(belegJahr).slice().reverse();
  const n = v => (Number(v)||0).toFixed(2).replace(".", ",");
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const biz = belegBereich === "H&E Tools";
  const mw = list.reduce((s,b) => s + (Number(b.mwst)||0), 0);
  const lines = [[`Belege ${belegBereich} ${belegJahr}`].map(q).join(";"), "",
    (biz ? ["Datum","Aussteller","Beschreibung","Kategorie","Netto (EUR)","MwSt (EUR)","Brutto (EUR)"] : ["Datum","Aussteller","Beschreibung","Kategorie","Betrag (EUR)"]).map(q).join(";"),
    ...list.map(b => [fmtDate(b.datum), b.haendler, b.beschreibung, b.kategorie].map(q).concat(biz ? [n((Number(b.betrag)||0)-(Number(b.mwst)||0)), n(b.mwst), n(b.betrag)] : [n(b.betrag)]).join(";")),
    "", ...katsFor(belegBereich).map(k => [k, n(sum(list.filter(b => b.kategorie === k)))]).filter(([,v]) => v !== "0,00").map(([k,v]) => `;;;${q("Summe "+k)}${biz?";;":""};${v}`),
    ...(biz ? [`;;;${q("Vorsteuer gesamt")};;${n(mw)};`] : []),
    `;;;${q("Gesamt "+belegJahr)}${biz?";"+n(sum(list)-mw)+";"+n(mw):""};${n(sum(list))}`];
  const csv = "﻿" + lines.join("\r\n");
  if (downloads) {
    try { await downloads.save({ filename: `Belege_HE_Tools_${belegJahr}.csv`, data: csv }); toast("Export gespeichert"); }
    catch (e) { if (e?.code !== "declined") toast("Export ist hier nicht möglich."); }
  } else {
    try { await navigator.clipboard.writeText(csv.slice(1).replace(/;/g, "\t")); toast("Tabelle kopiert – in Excel einfügen"); }
    catch { toast("Kopieren nicht möglich in dieser Ansicht."); }
  }
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "close-bg" && e.target !== el) return;
  if (el.closest(".tile") && act.startsWith("new-")) e.preventDefault();
  if (el.tagName === "BUTTON" || el.classList.contains("btn")) e.preventDefault();
  if (act === "close" || act === "close-bg") { pending?.ctl?.abort(); closeModal(); }
  else if (act === "new-fahrzeug") formFahrzeug();
  else if (act === "new-termin") formTermin();
  else if (act === "new-muell") formMuell();
  else if (act === "new-ausleihe") formAusleihe();
  else if (act === "new-forderung") formForderung();
  else if (act === "new-idee") formIdee();
  else if (act === "new-privtermin") formPriv();
  else if (act === "copy") { const tx = el.dataset.text; (navigator.clipboard?.writeText(tx) || Promise.reject()).then(() => toast("Link kopiert"), () => { window.prompt?.("Link kopieren:", tx); }); }
  else if (act === "ek-toggle" || act === "ek-again") { const it = S.items.find(i => i.id === el.dataset.id); if (it) { el.disabled = true; const p2 = act === "ek-again" ? saveItem({ kind: "einkauf", name: it.name, menge: it.menge || "", erledigt: false }) : saveItem({ ...it, erledigt: !it.erledigt }); p2.catch(() => toast("Speichern hat nicht geklappt.")); } }
  else if (act === "ek-clear") { if (el.dataset.sure) { const ids = ekDone().map(i => i.id); sb.from("he_items").delete().in("id", ids).then(({ error }) => { if (error) toast("Löschen hat nicht geklappt."); else { toast("Erledigte gelöscht"); loadItems(); } }); } else { el.dataset.sure = "1"; el.textContent = "Wirklich löschen?"; } }
  else if (act === "idee-filter") { ideeFilter = el.dataset.f; render(); }
  else if (act === "idee-kat") { ideeKat = el.dataset.k; render(); }
  else if (act === "idee-status" || act === "idee-fav") { const it = S.items.find(i => i.id === el.dataset.id); if (it) { el.disabled = true; saveItem(act === "idee-fav" ? { ...it, fav: !it.fav } : { ...it, status: el.dataset.s }).then(() => { if (el.dataset.s === "erledigt") toast("Umgesetzt – stark!"); }, () => { el.disabled = false; toast("Speichern hat nicht geklappt."); }); } }
  else if (act === "ford-filter") { fordFilter = el.dataset.f; render(); }
  else if (act === "ford-zahlung") { const it = S.items.find(i => i.id === el.dataset.id); if (it) formZahlung(it); }
  else if (act === "ford-offen") { const it = S.items.find(i => i.id === el.dataset.id); if (it) saveItem({ ...it, bezahlt: 0, bezahltAm: "" }).then(() => toast("Wieder offen"), () => toast("Speichern hat nicht geklappt.")); }
  else if (act === "aus-filter") { ausFilter = el.dataset.f; render(); }
  else if (act === "aus-zurueck" || act === "aus-offen") { const it = S.items.find(i => i.id === el.dataset.id); if (it) { el.disabled = true; saveItem({ ...it, zurueckAm: act === "aus-zurueck" ? iso(today()) : "" }).then(() => toast(act === "aus-zurueck" ? "Als zurückgegeben markiert" : "Wieder offen"), () => { el.disabled = false; toast("Speichern hat nicht geklappt."); }); } }
  else if (act === "home") { closeModal(); if (location.hash && location.hash !== "#") location.hash = ""; else render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act === "menu") openMenu();
  else if (act === "share") { closeModal(); openShare(); }
  else if (act === "logout") sb.auth.signOut();
  else if (act === "set-pw") { closeModal(); openPassword(); }
  else if (act === "login-mode") { loginMode = el.dataset.m; render(); }
  else if (act === "reload") refreshAll();
  else if (act === "member-del") { const u = el.dataset.uid; if (el.dataset.sure) { sb.from("he_members").delete().eq("user_id", u).then(({ error }) => { if (error) toast("Entfernen hat nicht geklappt."); else { closeModal(); toast("Person entfernt"); loadMembers().then(render); } }); } else { el.dataset.sure = "1"; el.textContent = "Wirklich entfernen?"; } }
  else if (act === "seen") markSeen();
  else if (act === "muell-typ") { const k = el.dataset.k; muellAus = muellAus.includes(k) ? muellAus.filter(x => x !== k) : [...muellAus, k]; saveMuellAus(); render(); }
  else if (act === "new-fix") formFix();
  else if (act === "new-geburtstag") formGeburtstag();
  else if (act === "new-beleg") formBeleg();
  else if (act === "new-ablage") formBeleg({}, ABLAGE);
  else if (act === "edit") { const it = S.items.find(i => i.id === el.dataset.id); if (!it) return; ({fahrzeug:formFahrzeug, termin:formTermin, beleg:formBeleg, muell:formMuell, geburtstag:formGeburtstag, fix:formFix, ausleihe:formAusleihe, forderung:formForderung, idee:formIdee, privtermin:formPriv})[it.kind]?.(it); }
  else if (act === "del") confirmDelete(el.dataset.id);
  else if (act === "del-yes") { deleteItem(el.dataset.id).then(() => { closeModal(); toast("Gelöscht"); }, () => toast("Löschen hat nicht geklappt.")); }
  else if (act === "export") exportCsv();
  else if (act === "bereich") { belegBereich = el.dataset.b; render(); }
  else if (act === "view-img") openModal(`${head("Beleg")}<img class="big-img" data-big="${esc(el.dataset.asset)}" src="${blobUrl(el.dataset.asset)}" alt="Foto der Rechnung">`);
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginFrm") return sendLink(e.target, e.submitter);
  if (e.target.id === "einkaufFrm") {
    const fd = new FormData(e.target); const name = String(fd.get("name") || "").trim(); if (!name) return;
    const menge = String(fd.get("menge") || "").trim(); e.target.reset();
    try { await saveItem({ kind: "einkauf", name, menge, erledigt: false }); } catch { toast("Speichern hat nicht geklappt."); }
    const inp = $("#ek-name"); if (inp) inp.focus();
    return;
  }
  if (e.target.id === "kalFrm") {
    const url = String(new FormData(e.target).get("url") || "").trim();
    if (!/^(webcals?|https):\/\//i.test(url)) return toast("Bitte einen Link mit webcal:// oder https:// einfügen.");
    try { await saveItem({ kind: "kalquelle", url, name: "" }); toast("Kalender verbunden – wird geladen"); await loadKal(true); } catch { toast("Speichern hat nicht geklappt."); }
    return;
  }
  if (e.target.id === "zahlFrm") {
    const it = S.items.find(i => i.id === e.target.dataset.id); if (!it) return closeModal();
    const fd = new FormData(e.target); const z = parseAmount(fd.get("betrag"));
    if (!isFinite(z) || z <= 0) return toast("Bitte einen gültigen Betrag eingeben.");
    const bezahlt = Math.round(((Number(it.bezahlt) || 0) + z) * 100) / 100;
    const voll = bezahlt >= (Number(it.betrag) || 0) - 0.004;
    const notiz = [it.notiz, `${fmtDate(String(fd.get("datum")))}: ${eur.format(z)} erhalten`].filter(Boolean).join(" · ");
    $("#zaSave").disabled = true;
    try { await saveItem({ ...it, bezahlt, bezahltAm: voll ? String(fd.get("datum")) : "", notiz }); closeModal(); toast(voll ? "Vollständig bezahlt" : "Teilzahlung gespeichert"); }
    catch { $("#zaSave").disabled = false; toast("Speichern hat nicht geklappt."); }
    return;
  }
  if (e.target.id === "pwFrm") {
    const fd = new FormData(e.target);
    if (fd.get("pw1") !== fd.get("pw2")) return toast("Die Passwörter stimmen nicht überein.");
    const { error } = await sb.auth.updateUser({ password: String(fd.get("pw1")) });
    if (error) return toast("Passwort konnte nicht gespeichert werden: " + error.message);
    closeModal(); return toast("Passwort gespeichert");
  }
  if (e.target.id === "shareFrm") {
    const btn = $("#shareSave"); btn.disabled = true; btn.textContent = "Wird gespeichert …";
    try { await saveShare(e.target); closeModal(); toast("Freigaben gespeichert"); render(); }
    catch { btn.disabled = false; btn.textContent = "Speichern"; toast("Freigaben konnten nicht gespeichert werden."); }
    return;
  }
  submitForm(e.target);
});
document.addEventListener("input", e => { if (e.target.id === "ideeQ") { ideeQ = e.target.value; $("#ideeList").innerHTML = ideeRows(); return; } if (e.target.id === "ablageQ") { ablageQ = e.target.value; $("#ablageList").innerHTML = ablageRows(); } });
document.addEventListener("change", e => {
  if (e.target.id === "bl-foto" && e.target.files[0]) { pending?.ctl?.abort(); onPhoto(e.target.files[0]); }
  if (e.target.id === "bl-bereich") { const k = $("#bl-kat"); if (k) k.innerHTML = katOptions(e.target.value, k.value); const g = $("#bl-gar-wrap"); if (g) g.hidden = e.target.value !== ABLAGE; }
  if (e.target.id === "ablageKat") { ablageKat = e.target.value; $("#ablageList").innerHTML = ablageRows(); }
  if (e.target.id === "jahrSel") { belegJahr = Number(e.target.value); render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalRoot").innerHTML) { pending?.ctl?.abort(); closeModal(); } });

render();
initStore();
})();
</script>
