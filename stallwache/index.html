<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hühnerhotel</title>
<meta name="theme-color" content="#13202f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Motel bei Nacht */
  --night:#13202f; --night2:#182839; --facade:#1d2f45; --facade2:#243a54; --line:#33506f;
  --chalk:#eef1e6; --muted:#9db0c4;
  --sign:#ffc93c; --sign2:#ffdb75; --neon-t:#43e0d0; --neon-r:#ff5468; --coral:#ff8a5c; --lilac:#b9a3ff; --mint:#8be38b; --sky:#6fb7ff;
  --ok:var(--neon-t); --warn:var(--sign); --bad:var(--neon-r);
  --text:var(--chalk); --bg:var(--night); --bg2:var(--night2); --card:var(--facade); --card2:var(--facade2); --yolk:var(--sign); --yolk2:var(--sign2); --comb:var(--neon-r);
  --disp:"Bungee", "Arial Black", sans-serif; --body:"Figtree", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--chalk);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(1200px 500px at 50% -180px, #22405f 0%, transparent 70%),
    radial-gradient(2px 2px at 12% 18%, #ffffff55 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 9%, #ffffff44 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 26%, #ffffff33 50%, transparent 51%),
    radial-gradient(2px 2px at 34% 6%, #ffffff40 50%, transparent 51%),
    var(--night);
  background-attachment:fixed}
a{color:var(--sign2)}
:focus-visible{outline:3px solid var(--neon-t);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 48px}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:20;background:rgba(19,32,47,.88);backdrop-filter:blur(12px);border-bottom:2px solid #0e1824;padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header.top .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{width:38px;height:38px}
.brand .wm{font:22px/1 var(--disp);color:var(--sign);text-shadow:0 0 10px rgba(255,201,60,.45);letter-spacing:.5px}
.brand small{display:block;font:500 12px/1.2 var(--body);color:var(--muted);margin-top:3px}
.sp{flex:1}
.iconbtn{background:var(--facade);border:2px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.iconbtn:hover{border-color:var(--sign)}
.back{background:none;border:none;color:var(--sign2);font-weight:700;cursor:pointer;padding:10px 0 0;font-size:15px}
h1{font:30px/1.1 var(--disp);margin:14px 0 10px;color:var(--chalk);letter-spacing:.3px}
h2{font:18px/1.2 var(--disp);margin:28px 0 12px;color:var(--sign);letter-spacing:.4px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Flächen */
.card{background:linear-gradient(180deg,var(--facade2),var(--facade));border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 0 -4px #0d1722}
.card+.card{margin-top:14px}

/* ═══ Neonschild ═══ */
.signpost{position:relative;margin:20px auto 6px;max-width:520px;cursor:pointer;display:block;text-decoration:none;color:inherit}
.signpost .board{position:relative;background:#0f1a27;border:4px solid #2c4560;border-radius:22px 22px 18px 18px;padding:18px 18px 16px;text-align:center;
  box-shadow:inset 0 0 0 3px #0a121c, 0 14px 0 -6px #0b1520, 0 0 60px -20px rgba(255,201,60,.35)}
.signpost .board::before{content:"";position:absolute;inset:8px;border-radius:14px;pointer-events:none;
  background:repeating-radial-gradient(circle at 10px 10px, #ffd97a 0 2.2px, transparent 2.6px 18px);opacity:.0}
.signpost .bulbs{position:absolute;inset:7px;border-radius:15px;pointer-events:none;border:3px dotted rgba(255,214,110,.75);filter:drop-shadow(0 0 3px rgba(255,201,60,.7))}
.signpost .name{font:clamp(30px,8.5vw,52px)/1 "Bungee Inline", var(--disp);color:var(--sign);margin:6px 0 4px;letter-spacing:1px;
  text-shadow:0 0 6px rgba(255,201,60,.9),0 0 22px rgba(255,170,40,.55)}
.signpost .sub{font:600 13px/1 var(--body);color:#c9d6e3;letter-spacing:.3px}
.vacancy{display:inline-block;margin-top:14px;padding:8px 18px 7px;border-radius:10px;border:3px solid currentColor;font:clamp(22px,6vw,32px)/1 var(--disp);letter-spacing:1.5px;background:#0b141e}
.vacancy.on-t{color:var(--neon-t);text-shadow:0 0 6px var(--neon-t),0 0 20px rgba(67,224,208,.7);box-shadow:0 0 14px rgba(67,224,208,.55),inset 0 0 14px rgba(67,224,208,.35)}
.vacancy.on-r{color:var(--neon-r);text-shadow:0 0 6px var(--neon-r),0 0 20px rgba(255,84,104,.7);box-shadow:0 0 14px rgba(255,84,104,.5),inset 0 0 14px rgba(255,84,104,.3)}
.vacancy.on-y{color:var(--sign);text-shadow:0 0 6px var(--sign),0 0 20px rgba(255,201,60,.6);box-shadow:0 0 14px rgba(255,201,60,.45),inset 0 0 14px rgba(255,201,60,.25)}
.vacancy.off{color:#4b6077;border-style:dashed}
.signpost .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.signpost .poles{display:flex;justify-content:space-between;width:58%;margin:0 auto;height:26px}
.signpost .poles i{display:block;width:12px;background:linear-gradient(90deg,#2c4560,#456789,#2c4560);border-radius:0 0 3px 3px}
@media (prefers-reduced-motion:no-preference){
  .vacancy.flick{animation:flick 1.6s steps(1,end) 1}
  @keyframes flick{0%{opacity:.15}8%{opacity:1}12%{opacity:.2}18%{opacity:1}40%{opacity:.35}44%{opacity:1}100%{opacity:1}}
}

/* ═══ Schlüsselanhänger ═══ */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding-top:6px}
.key{--c:var(--sign);display:block;width:100%;font:inherit;position:relative;cursor:pointer;padding-top:22px;transform:rotate(var(--r,0deg));transition:transform .15s ease;border:none;background:none;text-align:left;color:inherit}
.key:hover,.key:focus-visible{transform:rotate(0deg) translateY(-3px)}
.key .ring{display:block;position:absolute;top:0;left:30px;width:30px;height:30px;border-radius:50%;border:3px solid #a9b8c6;border-bottom-color:transparent;transform:rotate(-30deg)}
.key .fob{display:block;position:relative;background:var(--c);color:#162231;border-radius:16px 46px 16px 16px;padding:26px 14px 14px;min-height:122px;box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.12)}
.key .fob::before{content:"";position:absolute;top:10px;left:38px;width:12px;height:12px;border-radius:50%;background:var(--night);box-shadow:inset 0 2px 2px rgba(0,0,0,.5)}
.key .fob::after{content:"";position:absolute;inset:6px;border-radius:12px 40px 12px 12px;border:2px dashed rgba(22,34,49,.28);pointer-events:none}
.key .ic{display:block;position:absolute;bottom:10px;right:12px;font-size:24px}
.key .t{font:16px/1.1 var(--disp);margin-top:6px;white-space:nowrap}
.key .s{font:600 13px/1.3 var(--body);opacity:.78;margin-top:5px;padding-right:30px}
.key .badge{position:absolute;top:-6px;right:-4px;background:var(--neon-r);color:#fff;border:2px solid var(--night);font:700 12px/1 var(--body);padding:5px 8px;border-radius:999px;z-index:2}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--facade2);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn:hover{border-color:#5a7da3}
.btn.pri{background:var(--sign);border-color:var(--sign);color:#1a2533;box-shadow:0 4px 0 #b88a14}
.btn.pri:hover{background:var(--sign2)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #b88a14}
.btn.bad{background:transparent;border-color:#7a2a36;color:#ff8f9c}
.btn.big{white-space:nowrap;padding:16px 20px;font:20px/1 var(--disp);letter-spacing:.5px;border-radius:14px;flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;border:2px solid var(--line);background:#0f1a27}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.warn{background:var(--warn);box-shadow:0 0 6px var(--warn)} .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.hero{display:flex;gap:16px;align-items:center}
.door{width:92px;height:92px;flex:none}
.hero .state{font:26px/1.1 var(--disp)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:14px}
.kv div{background:#0f1a27;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kv b{display:block;font:20px/1.2 var(--disp);color:var(--sign2)}
.kv span{font-size:12.5px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:140px}
input,select,textarea{background:#0f1a27;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;color-scheme:dark}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sign)}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--facade);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.li .m{flex:1;min-width:0}
.li .m .a{font-weight:700}
.li .m .b{font-size:13px;color:var(--muted)}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border:none}
.ev .e{width:26px;text-align:center}
.ev .tm{color:var(--muted);font-size:13px;white-space:nowrap}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#05090e;border:3px solid #0b141e;aspect-ratio:16/9;display:grid;place-items:center;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam .ov{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumbs figure{margin:0;cursor:pointer;background:#eef1e6;padding:6px 6px 4px;border-radius:4px;transform:rotate(-1deg)}
.thumbs figure:nth-child(even){transform:rotate(1.2deg)}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;background:#000;display:block}
.thumbs figcaption{font-size:11px;color:#3a4a5c;text-align:center;padding-top:3px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:8px}
.bars div{flex:1;background:linear-gradient(180deg,var(--sign2),var(--sign));border-radius:10px 10px 3px 3px;min-height:2px;position:relative}
.bars div.z{background:var(--line)}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#05090e;padding:2px 6px;border-radius:6px;font-size:11px;white-space:nowrap}
.counter{display:flex;align-items:center;gap:18px;justify-content:center;margin:10px 0}
.counter button{width:66px;height:66px;border-radius:50%;font:30px/1 var(--disp)}
.counter .n{font:64px/1 var(--disp);min-width:100px;text-align:center;color:var(--sign);text-shadow:0 0 18px rgba(255,201,60,.4)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#0f1a27}
.seg button{background:transparent;border:none;padding:9px 14px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--sign);color:#1a2533}
.modal{position:fixed;inset:0;background:rgba(5,10,16,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:var(--night2);border:2px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--sign);color:#1a2533;font-weight:700;padding:12px 18px;border-radius:12px;z-index:60;box-shadow:0 6px 0 #b88a14;max-width:90vw}
.center{min-height:80vh;display:grid;place-items:center;text-align:center}
.login{max-width:400px;width:100%}
.login .signpost{margin-top:0;cursor:default}
.warnbox{background:#3a1520;border:2px solid #7a2a36;color:#ffc2ca;border-radius:12px;padding:12px 14px}
.infobox{background:#3a3112;border:2px solid #7a6420;color:#ffe9a8;border-radius:12px;padding:12px 14px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--sign);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.big-img{position:fixed;inset:0;background:rgba(5,10,16,.94);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.big-img img{max-width:100%;max-height:85vh;border-radius:10px}
table.mem{width:100%;border-collapse:collapse}
table.mem td{padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px}
table.mem select{padding:6px 8px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
.chk input{width:22px;height:22px;accent-color:var(--sign)}
details summary{cursor:pointer}

/* ═══ Smartphone ═══ */
html,body{overflow-x:hidden}
header.top .in{min-width:0}
.brand{min-width:0}
.brand .wm{white-space:nowrap}
#hdrConn{white-space:nowrap;flex:none}
@media (max-width:560px){
  header.top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  header.top .in{gap:8px}
  .brand{gap:8px}
  .brand img{width:30px;height:30px}
  .brand .wm{font-size:18px}
  .brand small{font-size:11px}
  #hdrConn{padding:7px;gap:0}
  #hdrConn span:last-child{display:none}
  .iconbtn{width:38px;height:38px;flex:none}
  .wrap{padding:0 12px 40px}
  h1{font-size:25px}
  .signpost{margin:14px auto 4px}
  .signpost .board{padding:14px 12px 14px}
  .signpost .meta{gap:6px}
  .keys{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .key .fob{min-height:112px;padding:24px 12px 12px}
  .card{padding:14px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:9px 6px;font-size:14px}
  .btn.big{font-size:17px;padding:15px 10px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counter{gap:12px}
  .counter .n{font-size:54px;min-width:80px}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
  label.f{min-width:0}
  .row > label.f{flex:1 1 130px}
}
@media (max-width:350px){
  .brand small{display:none}
  .keys{gap:16px 10px}
  .key .t{font-size:14px}
}
</style>
</head>
<body>
<header class="top" id="hdr" hidden>
  <div class="in">
    <div class="brand" onclick="go('')" role="link" tabindex="0"><img src="icon.svg" alt=""><div><span class="wm">Hühnerhotel</span><small id="hdrSub">Gitzensteig</small></div></div>
    <div class="sp"></div>
    <span id="hdrConn" class="pill"><span class="dot"></span><span>…</span></span>
    <button class="iconbtn" title="Einstellungen" onclick="go('profil')">⚙️</button>
  </div>
</header>
<main class="wrap" id="app"><div class="center"><div class="spin"></div></div></main>

const fmtDT = (ts) => { const d = new Date(ts); return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };

/* ═════════ Sonnenzeiten (NOAA, wie auf dem Pi) ═════════ */
function sunTimes(date, lat, lon) {
  const rad = Math.PI / 180, day = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(date.getFullYear(), 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (day - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const cosH = (Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec))) - Math.tan(lat * rad) * Math.tan(dec);
  if (cosH > 1 || cosH < -1) return null;
  const ha = Math.acos(cosH) / rad;
  const mk = (min) => new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + min * 60000);
  return { rise: mk(720 - 4 * (lon + ha) - eq), set: mk(720 - 4 * (lon - ha) - eq) };
}
const hm = (d) => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '–';
function planToday(c) {
  if (!c) return {};
  const d = new Date(), s = sunTimes(d, +c.lat || 47.67, +c.lon || 9.59);
  const at = (t) => { const [h, m] = String(t || '00:00').split(':').map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  let auf, zu;
  if (c.zeitart === 'fix') { auf = at(c.auf_fix); zu = at(c.zu_fix); }
  else {
    auf = new Date(s.rise.getTime() + (+c.auf_offset || 0) * 60000);
    zu = new Date(s.set.getTime() + (+c.zu_offset || 0) * 60000);
    if (c.auf_frueheste && auf < at(c.auf_frueheste)) auf = at(c.auf_frueheste);
    if (c.zu_spaeteste && zu > at(c.zu_spaeteste)) zu = at(c.zu_spaeteste);
  }
  return { rise: s?.rise, set: s?.set, auf, zu, alarm: new Date(zu.getTime() + (+c.alarm_min || 30) * 60000) };
}

/* ═════════ Verbindung zum Stall ═════════ */
function conn() {
  if (!st?.last_seen) return { c: 'bad', t: 'Stall noch nie verbunden' };
  const s = (Date.now() - new Date(st.last_seen)) / 1000;
  if (s < 120) return { c: 'ok', t: 'Stall online' };
  if (s < 600) return { c: 'warn', t: 'Stall verzögert' };
  return { c: 'bad', t: 'Stall offline' };
}
function paintConn() {
  const c = conn(); const el = $('#hdrConn');
  if (!el) return;
  el.hidden = !(canView('klappe') || canView('kamera') || canView('ziegen'));
  el.innerHTML = `<span class="dot ${c.c}"></span><span>${c.t.replace('Stall ', '')}</span>`;
  el.title = c.t + (st?.last_seen ? ' – letzte Meldung ' + ago(st.last_seen) : '');
}
async function loadState() {
  if (!(canView('klappe') || canView('kamera') || canView('ziegen'))) return;

    <path d="M10 44 L50 12 L90 44 Z" fill="#ff5468"/><rect x="18" y="42" width="64" height="52" rx="4" fill="#243a54" stroke="#33506f" stroke-width="2"/>
    <rect x="34" y="52" width="32" height="42" fill="#05090e"/>
    <rect x="34" y="${y}" width="32" height="34" rx="2" fill="${col}" opacity=".95" style="transition:y .4s"/>
    ${open ? '<circle cx="50" cy="80" r="7" fill="#f4efe4"/><path d="M46 73 q4 -6 8 0" fill="#e0533f"/><path d="M57 80 l5 1 -5 2z" fill="#f2b33d"/>' : ''}

}

};
let signFlicked = false;

/* ═════════ Kamera ═════════ */
function camList() { const n = st?.info?.cams; return Array.isArray(n) && n.length ? n : ['Kamera 1', 'Kamera 2']; }
async function signed(path, sec = 300) { const { data } = await sb.storage.from('hs-cam').createSignedUrl(path, sec); return data?.signedUrl; }
async function paintKamera() {
  const cams = camList();
  $('#app').innerHTML = `${backBtn()}<h1>📷 Kamera</h1>
    <div class="row" style="margin-bottom:12px"><button class="btn pri" id="liveBtn">▶️ Live-Bild</button><button class="btn" id="refBtn">🔄 Aktuelles Bild holen</button><span class="small muted" id="liveInfo"></span></div>
    ${cams.map((n, i) => `<div class="card" style="padding:10px"><div class="cam" id="cam${i}"><span class="muted small">Noch kein Bild</span></div>
      <div class="row small muted" style="margin:8px 4px 0"><b style="color:var(--text)">${esc(n)}</b><span class="sp"></span><span id="camT${i}"></span></div></div>`).join('')}
    <h2>Verlauf (letzte 14 Tage)</h2><p class="small muted" style="margin-top:-6px">Bilder beim Öffnen und Schließen der Klappe.</p><div class="thumbs" id="arch"><div class="spin"></div></div>
    <p class="small muted" style="margin-top:18px">Für flüssiges Video mit Ton nutzt du weiter die Kamera-App. Die Bilder hier kommen über den Pi.</p>`;
  $('#liveBtn').onclick = () => (liveOn ? stopLive() : startLive());
  $('#refBtn').onclick = async () => { const { error } = await sb.rpc('hs_live', { sek: 8 }); if (error) return err(error); toast('Bild wird geholt …'); burst(10); };
  await loadState(); await paintCams(true); paintArchive();
}
async function paintCams(force) {
  const cams = camList();
  for (let i = 0; i < cams.length; i++) {
    const ts = st?.snaps?.['cam' + i]; const box = $('#cam' + i); if (!box) return;
    $('#camT' + i).textContent = ts ? fmtDT(ts) + ' · ' + ago(ts) : '';
    if (!ts) continue;
    if (!force && camSnapSeen[i] === ts) continue;
    camSnapSeen[i] = ts;
    const url = await signed(`cam${i}/latest.jpg`, 120);
    if (!url) continue;
    const img = new Image(); img.onload = () => { box.innerHTML = ''; box.appendChild(img); if (liveOn) box.insertAdjacentHTML('beforeend', '<div class="ov"><span class="pill" style="background:#7a1d12;border-color:#a33">● LIVE</span></div>'); };
    img.src = url + '&t=' + encodeURIComponent(ts); img.alt = cams[i]; img.onclick = () => bigImg(img.src, cams[i]);
  }
}
let burstT = null;
function burst(n) { clearInterval(burstT); let k = 0; burstT = setInterval(async () => { k++; await loadState(); await paintCams(); if (k >= n) clearInterval(burstT); }, 2000); }
async function startLive() {
  if (conn().c === 'bad') return toast('Stall ist offline – kein Live-Bild möglich.');
  liveOn = true; $('#liveBtn').textContent = '⏹ Live beenden'; $('#liveInfo').textContent = 'Bild alle paar Sekunden …';
  const ping = () => sb.rpc('hs_live', { sek: 45 });
  await ping();
  let k = 0;
  liveT = setInterval(async () => { if (document.hidden) return; k++; if (k % 15 === 0) ping(); await loadState(); await paintCams(); if (k > 300) stopLive(); }, 2000);
}
function stopLive() {
  clearInterval(liveT); clearInterval(burstT); liveT = null;
  if (liveOn) { liveOn = false; const b = $('#liveBtn'); if (b) b.textContent = '▶️ Live-Bild'; const i = $('#liveInfo'); if (i) i.textContent = ''; }
}
async function paintArchive() {
  const { data, error } = await sb.storage.from('hs-cam').list('archiv', { limit: 60, sortBy: { column: 'name', order: 'desc' } });
  const el = $('#arch'); if (!el) return;
  if (error || !data?.length) { el.innerHTML = '<span class="muted small">Noch keine Bilder.</span>'; return; }
  const files = data.filter((f) => f.name.endsWith('.jpg')).slice(0, 40);
  const { data: urls } = await sb.storage.from('hs-cam').createSignedUrls(files.map((f) => 'archiv/' + f.name), 600);
  const cams = camList();
  el.innerHTML = files.map((f, i) => {
    const m = f.name.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})\d{2}_cam(\d)(?:_(\w+))?/);
    const cap = m ? `${m[3]}.${m[2]}. ${m[4]}:${m[5]} ${m[7] === 'zu' ? '🌙' : m[7] === 'auf' ? '🐔' : ''} ${esc(cams[+m[6]] || '')}` : esc(f.name);
    return `<figure data-u="${esc(urls?.[i]?.signedUrl || '')}" data-c="${cap}"><img loading="lazy" src="${esc(urls?.[i]?.signedUrl || '')}" alt=""><figcaption>${cap}</figcaption></figure>`;
  }).join('');
  el.querySelectorAll('figure').forEach((f) => (f.onclick = () => bigImg(f.dataset.u, f.dataset.c)));
}
function bigImg(src, cap) {
  const d = document.createElement('div'); d.className = 'big-img';
  d.innerHTML = `<img src="${esc(src)}" alt=""><div class="muted small" style="margin-top:10px">${cap}</div><button class="btn" style="margin-top:12px">Schließen</button>`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
}

/* ═════════ Tagebuch: gemeinsame Funktionen ═════════ */
async function items(tile) {
  const { data, error } = await sb.from('hs_items').select('*').eq('tile', tile).order('created_at', { ascending: false }).limit(2000);
  if (error) { err(error); return []; }
  return data || [];
}
async function saveItem(tile, kind, data, id) {
  const q = id ? sb.from('hs_items').update({ data }).eq('id', id) : sb.from('hs_items').insert({ tile, kind, data });
  const { error } = await q; if (error) { err(error); return false; } return true;
}
async function delItem(id) {
  if (!(await confirmBox('Eintrag wirklich löschen?', 'Löschen'))) return false;
  const { error } = await sb.from('hs_items').delete().eq('id', id); if (error) { err(error); return false; } return true;
}

/* ═════════ Ziegen ═════════ */
function zFreigabe(z) {
  z = z || {}; const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  const toM = (t) => { const [h, mi] = String(t || '00:00').split(':').map(Number); return h * 60 + mi; };
  if (z.modus === 'an') return { ok: true, t: 'Freigegeben', s: 'dauerhaft, bis jemand sie abschaltet' };
  if (z.modus === 'zeit') {
    const v = toM(z.von), b = toM(z.bis), in_ = v <= b ? m >= v && m < b : m >= v || m < b;
    return in_ ? { ok: true, t: 'Freigegeben', s: `heute bis ${z.bis} Uhr` } : { ok: false, t: 'Gesperrt', s: `Freigabe von ${z.von} bis ${z.bis} Uhr` };
  }
  return { ok: false, t: 'Gesperrt', s: 'Freigabe ist ausgeschaltet' };
}

    m.querySelector('#gzU') && (m.querySelector('#gzU').onclick = () => (m.querySelector('#gzC').value = unk.chip));

      m.remove(); toast('Passwort gespeichert ✅');
    };
  };
}
async function swReg() { if (!('serviceWorker' in navigator)) return null; return navigator.serviceWorker.register('sw.js'); }
function b64u(s) { const p = '='.repeat((4 - (s.length % 4)) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map((c) => c.charCodeAt(0))); }
async function paintPush() {
  const box = $('#pushBox');
  if (!('PushManager' in window) || !('serviceWorker' in navigator)) { box.innerHTML = `<p class="muted">Dieses Gerät/Browser unterstützt keine Push-Nachrichten.${/iPhone|iPad/.test(navigator.userAgent) ? ' Auf dem iPhone: Seite über „Teilen → Zum Home-Bildschirm“ hinzufügen und die App von dort öffnen.' : ''}</p>`; return; }
  const reg = await swReg(); const sub = await reg.pushManager.getSubscription();
  let row = null;
  if (sub) { const { data } = await sb.from('hs_push_subs').select('*').eq('endpoint', sub.endpoint).maybeSingle(); row = data; }
  if (!sub || !row) {
    box.innerHTML = `<p class="muted" style="margin-top:0">Lass dich benachrichtigen, wenn die Klappe abends offen bleibt oder der Stall offline ist.</p><button class="btn pri" id="pOn">🔔 Benachrichtigungen aktivieren</button>`;
    $('#pOn').onclick = async () => {
      try {
        const perm = await Notification.requestPermission(); if (perm !== 'granted') return toast('Benachrichtigungen wurden nicht erlaubt.');
        const { publicKey } = await (await fetch(FN + '/hs-push')).json();
        const s = sub || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publicKey) }));
        const j = s.toJSON();
        const { error } = await sb.from('hs_push_subs').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id }, { onConflict: 'endpoint' });
        if (error) throw error; toast('Aktiviert ✅'); paintPush();
      } catch (e) { err(e); }
    };
    return;
  }
  const prefs = row.prefs || {};
  box.innerHTML = PUSHCAT.map((c) => `<label class="chk"><input type="checkbox" data-k="${c.k}" ${prefs[c.k] !== false ? 'checked' : ''}><div><div>${c.t}</div>${c.d ? `<div class="small muted">${c.d}</div>` : ''}</div></label>`).join('') +
    `<div class="row" style="margin-top:10px"><button class="btn" id="pTest">Testnachricht</button><button class="btn bad" id="pOff">Auf diesem Gerät aus</button></div>`;
  box.querySelectorAll('[data-k]').forEach((c) => (c.onchange = async () => { prefs[c.dataset.k] = c.checked; const { error } = await sb.from('hs_push_subs').update({ prefs }).eq('id', row.id); if (error) err(error); }));
  $('#pTest').onclick = async () => { const { data: { session } } = await sb.auth.getSession(); const r = await fetch(FN + '/hs-push', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_KEY }, body: JSON.stringify({ test: true }) }); const j = await r.json(); toast(j.sent ? 'Testnachricht gesendet' : 'Nichts gesendet: ' + (j.error || '0 Geräte')); };
  $('#pOff').onclick = async () => { await sb.from('hs_push_subs').delete().eq('id', row.id); await sub.unsubscribe(); paintPush(); };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && member?.status === 'approved') { loadState(); } });
boot().catch(err);
</script>
