<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stallwache</title>
<meta name="theme-color" content="#16140f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#16140f; --bg2:#1f1c16; --card:#26221b; --card2:#2f2a21; --line:#3a3428;
  --text:#f4efe4; --muted:#a99f8c; --yolk:#f2b33d; --yolk2:#ffcf6e; --comb:#e0533f;
  --ok:#5cb874; --warn:#f2b33d; --bad:#e0533f; --blue:#6aa7e0;
  --r:16px; --sh:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--yolk2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:20;background:rgba(22,20,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.2px;cursor:pointer}
.brand img{width:36px;height:36px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.sp{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.back{background:none;border:none;color:var(--yolk2);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
h1{font-size:24px;margin:18px 0 6px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;position:relative}
.tile:hover{transform:translateY(-2px);border-color:#5a5040}
.tile .ic{font-size:30px}
.tile .t{font-weight:700}
.tile .s{font-size:13px;color:var(--muted)}
.tile .badge{position:absolute;top:12px;right:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#5a5040}
.btn.pri{background:var(--yolk);border-color:var(--yolk);color:#231a05}
.btn.pri:hover{background:var(--yolk2)}
.btn.bad{background:transparent;border-color:#6b2d24;color:#ff8f7d}
.btn.big{padding:16px 20px;font-size:18px;border-radius:14px;flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--bg2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.hero{display:flex;gap:16px;align-items:center}
.door{width:92px;height:92px;flex:none}
.hero .state{font-size:28px;font-weight:800;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:18px}
.kv span{font-size:12px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:140px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yolk);outline-offset:-1px}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.li .m{flex:1;min-width:0}
.li .m .a{font-weight:600}
.li .m .b{font-size:13px;color:var(--muted)}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:none}
.ev .e{width:26px;text-align:center}
.ev .tm{color:var(--muted);font-size:13px;white-space:nowrap}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9;display:grid;place-items:center}
.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam .ov{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.cam .ov2{position:absolute;right:10px;bottom:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumbs figure{margin:0;cursor:pointer}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
.thumbs figcaption{font-size:11px;color:var(--muted);text-align:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--yolk);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.z{background:var(--line)}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;padding:2px 6px;border-radius:6px;font-size:11px;white-space:nowrap}
.counter{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0}
.counter button{width:64px;height:64px;border-radius:50%;font-size:30px;font-weight:800}
.counter .n{font-size:56px;font-weight:800;min-width:90px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--bg2);border:none;padding:9px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--yolk);color:#231a05}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:60;box-shadow:var(--sh);max-width:90vw}
.center{min-height:80vh;display:grid;place-items:center;text-align:center}
.login{max-width:380px;width:100%}
.login img{width:96px;height:96px}
.warnbox{background:#3a1d17;border:1px solid #6b2d24;color:#ffc1b6;border-radius:12px;padding:12px 14px}
.infobox{background:#2b2617;border:1px solid #5a4a20;border-radius:12px;padding:12px 14px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--yolk);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.big-img{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.big-img img{max-width:100%;max-height:85vh;border-radius:10px}
table.mem{width:100%;border-collapse:collapse}
table.mem td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
table.mem select{padding:6px 8px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
.chk input{width:22px;height:22px;accent-color:var(--yolk)}
</style>
</head>
<body>
<header class="top" id="hdr" hidden>
  <div class="in">
    <div class="brand" onclick="go('')"><img src="icon.svg" alt=""><div>Stallwache<small id="hdrSub">Hühnerstall</small></div></div>
    <div class="sp"></div>
    <span id="hdrConn" class="pill"><span class="dot"></span><span>…</span></span>
    <button class="iconbtn" title="Einstellungen" onclick="go('profil')">⚙️</button>
  </div>
</header>
<main class="wrap" id="app"><div class="center"><div class="spin"></div></div></main>

<script>
/* ═════════ Konfiguration ═════════ */
const SUPABASE_URL = 'https://kdqtfbhwjqymfbaunkwg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bEARbfjx56Xq7oUg9GQESA_BILmK_Jm';
const FN = SUPABASE_URL + '/functions/v1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const TILES = [
  { key: 'klappe',     icon: '🚪', name: 'Klappe',     desc: 'Status, auf/zu, Zeiten, Protokoll' },
  { key: 'kamera',     icon: '📷', name: 'Kamera',     desc: 'Bilder aus dem Stall' },
  { key: 'eier',       icon: '🥚', name: 'Eier',       desc: 'Legeleistung zählen' },
  { key: 'pflege',     icon: '🧹', name: 'Pflege',     desc: 'Futter, Wasser, Ausmisten' },
  { key: 'herde',      icon: '🐔', name: 'Herde',      desc: 'Unsere Hühner' },
  { key: 'gesundheit', icon: '🩺', name: 'Gesundheit', desc: 'Behandlungen & Tierarzt' },
];
const DOOR = {
  offen:     { t: 'Klappe offen',     c: 'ok',   e: '🐔' },
  zu:        { t: 'Klappe zu',        c: 'ok',   e: '🌙' },
  oeffnet:   { t: 'Klappe öffnet …',  c: 'warn', e: '⬆️' },
  schliesst: { t: 'Klappe schließt …',c: 'warn', e: '⬇️' },
  zwischen:  { t: 'Zwischenstellung', c: 'warn', e: '↕️' },
  stoerung:  { t: 'Störung',          c: 'bad',  e: '⚠️' },
  unbekannt: { t: 'Status unbekannt', c: '',     e: '❔' },
};
const EVI = { auf: '🐔', zu: '🌙', befehl: '👆', alarm: '🚨', fehler: '⚠️', offline: '📡', online: '📡', info: 'ℹ️', start: '🔌' };

/* ═════════ Zustand ═════════ */
let me = null, member = null, cfg = null, st = null, names = {};
let pollT = null, liveT = null, liveOn = false, camUrls = {}, camSnapSeen = {};

/* ═════════ Helfer ═════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const level = (t) => !member ? 'none' : member.role === 'admin' ? 'edit' : (member.tiles?.[t] || 'none');
const canView = (t) => ['view', 'edit'].includes(level(t));
const canEdit = (t) => level(t) === 'edit';
const pad = (n) => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtD = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const fmtDT = (ts) => { const d = new Date(ts); return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const fmtT = (ts) => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const daysSince = (iso) => Math.round((new Date(todayISO()) - new Date(iso)) / 86400000);
function ago(ts) {
  if (!ts) return 'nie';
  const s = Math.round((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return 'gerade eben'; if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`; return `vor ${Math.round(s / 86400)} Tagen`;
}
function toast(t, ms = 2600) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function modal(html, onMount) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener('click', (e) => { if (e.target === m) m.remove(); });
  document.body.appendChild(m); onMount?.(m); return m;
}
function confirmBox(text, yes = 'Ja') {
  return new Promise((res) => {
    const m = modal(`<h3>${esc(text)}</h3><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-n>Abbrechen</button><button class="btn pri" data-y>${esc(yes)}</button></div>`);
    m.querySelector('[data-n]').onclick = () => { m.remove(); res(false); };
    m.querySelector('[data-y]').onclick = () => { m.remove(); res(true); };
  });
}
function err(e) { console.error(e); toast('Fehler: ' + (e?.message || e)); }

/* ═════════ Sonnenzeiten (NOAA, wie auf dem Pi) ═════════ */
function sunTimes(date, lat, lon) {
  const rad = Math.PI / 180, day = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(date.getFullYear(), 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (day - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const cosH = (Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec))) - Math.tan(lat * rad) * Math.tan(dec);
  if (cosH > 1 || cosH < -1) return null;
  const ha = Math.acos(cosH) / rad;
  const mk = (min) => new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + min * 60000);
  return { rise: mk(720 - 4 * (lon + ha) - eq), set: mk(720 - 4 * (lon - ha) - eq) };
}
const hm = (d) => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '–';
function planToday(c) {
  if (!c) return {};
  const d = new Date(), s = sunTimes(d, +c.lat || 47.67, +c.lon || 9.59);
  const at = (t) => { const [h, m] = String(t || '00:00').split(':').map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  let auf, zu;
  if (c.zeitart === 'fix') { auf = at(c.auf_fix); zu = at(c.zu_fix); }
  else {
    auf = new Date(s.rise.getTime() + (+c.auf_offset || 0) * 60000);
    zu = new Date(s.set.getTime() + (+c.zu_offset || 0) * 60000);
    if (c.auf_frueheste && auf < at(c.auf_frueheste)) auf = at(c.auf_frueheste);
    if (c.zu_spaeteste && zu > at(c.zu_spaeteste)) zu = at(c.zu_spaeteste);
  }
  return { rise: s?.rise, set: s?.set, auf, zu, alarm: new Date(zu.getTime() + (+c.alarm_min || 30) * 60000) };
}

/* ═════════ Verbindung zum Stall ═════════ */
function conn() {
  if (!st?.last_seen) return { c: 'bad', t: 'Stall noch nie verbunden' };
  const s = (Date.now() - new Date(st.last_seen)) / 1000;
  if (s < 120) return { c: 'ok', t: 'Stall online' };
  if (s < 600) return { c: 'warn', t: 'Stall verzögert' };
  return { c: 'bad', t: 'Stall offline' };
}
function paintConn() {
  const c = conn(); const el = $('#hdrConn');
  if (!el) return;
  el.hidden = !(canView('klappe') || canView('kamera'));
  el.innerHTML = `<span class="dot ${c.c}"></span><span>${c.t.replace('Stall ', '')}</span>`;
  el.title = c.t + (st?.last_seen ? ' – letzte Meldung ' + ago(st.last_seen) : '');
}
async function loadState() {
  if (!(canView('klappe') || canView('kamera'))) return;
  const { data } = await sb.from('hs_state').select('*').eq('id', 1).maybeSingle();
  if (data) st = data;
  paintConn();
}
async function loadCfg() {
  if (!(canView('klappe') || canView('pflege'))) return;
  const { data } = await sb.from('hs_config').select('data').eq('id', 1).maybeSingle();
  cfg = data?.data || {};
}

/* ═════════ Auth ═════════ */
let booting = null;
function boot() { if (!booting) booting = bootInner().finally(() => { booting = null; }); return booting; }
async function bootInner() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  me = session.user;
  let { data: m } = await sb.from('hs_members').select('*').eq('user_id', me.id).maybeSingle();
  if (!m) {
    const r = await sb.from('hs_members').insert({ user_id: me.id }).select().maybeSingle();
    if (r.error) return err(r.error);
    m = r.data;
  }
  member = m;
  if (m.status !== 'approved') return showPending();
  $('#hdr').hidden = false;
  await Promise.all([loadState(), loadCfg(), sb.rpc('hs_names').then(({ data }) => (data || []).forEach((x) => (names[x.user_id] = x.name)))]);
  route();
  clearInterval(pollT);
  pollT = setInterval(async () => { if (document.hidden) return; await loadState(); if (location.hash === '' || location.hash === '#') paintHome(); if (location.hash === '#klappe') paintKlappe(true); }, 10000);
}
function showLogin() {
  $('#hdr').hidden = true;
  let mode = 'pw';
  const draw = () => {
    $('#app').innerHTML = `<div class="center"><div class="login col">
      <img src="icon.svg" alt="" style="margin:0 auto"><h1 style="margin:6px 0 0">Stallwache</h1>
      <p class="muted" style="margin:0 0 10px">Hühnerstall im Blick – Klappe, Kamera, Tagebuch.</p>
      <div class="seg" style="align-self:center"><button data-m="pw" class="${mode === 'pw' ? 'on' : ''}">Passwort</button><button data-m="link" class="${mode === 'link' ? 'on' : ''}">Link per E-Mail</button><button data-m="neu" class="${mode === 'neu' ? 'on' : ''}">Registrieren</button></div>
      ${mode === 'neu' ? '<input id="nm" placeholder="Dein Name" autocomplete="name">' : ''}
      <input id="em" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
      ${mode !== 'link' ? `<input id="pw" type="password" placeholder="Passwort${mode === 'neu' ? ' (mind. 8 Zeichen)' : ''}" autocomplete="${mode === 'neu' ? 'new-password' : 'current-password'}">` : ''}
      <button class="btn pri" id="go">${{ pw: 'Anmelden', link: 'Anmelde-Link schicken', neu: 'Konto anlegen' }[mode]}</button>
      <div id="msg" class="small"></div>
      <p class="small muted">Gleiches Konto wie Florian HQ / H&amp;E Hub. Neue Personen werden vom Admin freigeschaltet.</p></div></div>`;
    document.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => { mode = b.dataset.m; draw(); }));
    const msg = (t, bad) => { $('#msg').innerHTML = `<div class="${bad ? 'warnbox' : 'infobox'}">${t}</div>`; };
    const goBtn = $('#go');
    const submit = async () => {
      const email = $('#em').value.trim(), password = $('#pw')?.value || '';
      if (!email) return msg('Bitte E-Mail eingeben.', true);
      goBtn.disabled = true;
      try {
        if (mode === 'link') {
          const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
          if (error) return msg(/rate|limit/i.test(error.message) ? 'Gerade zu viele Mails verschickt – bitte später nochmal oder mit Passwort anmelden.' : esc(error.message), true);
          msg(`📬 Link ist unterwegs an <b>${esc(email)}</b>. Mail auf diesem Gerät öffnen und auf den Link tippen.`);
        } else if (mode === 'neu') {
          if (password.length < 8) return msg('Passwort braucht mindestens 8 Zeichen.', true);
          const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname, data: { app: 'stallwache', name: ($('#nm')?.value || '').trim() } } });
          if (error) return msg(/registered|exists/i.test(error.message) ? 'Diese E-Mail hat schon ein Konto – einfach mit Passwort anmelden.' : esc(error.message), true);
          if (!data.session) msg('Fast fertig: Bestätige die E-Mail, die du gerade bekommen hast, und melde dich dann hier an.');
          else boot();
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });

  const box = $('#pushBox');
  if (!('PushManager' in window) || !('serviceWorker' in navigator)) { box.innerHTML = `<p class="muted">Dieses Gerät/Browser unterstützt keine Push-Nachrichten.${/iPhone|iPad/.test(navigator.userAgent) ? ' Auf dem iPhone: Seite über „Teilen → Zum Home-Bildschirm“ hinzufügen und die App von dort öffnen.' : ''}</p>`; return; }
  const reg = await swReg(); const sub = await reg.pushManager.getSubscription();
  let row = null;
  if (sub) { const { data } = await sb.from('hs_push_subs').select('*').eq('endpoint', sub.endpoint).maybeSingle(); row = data; }
  if (!sub || !row) {
    box.innerHTML = `<p class="muted" style="margin-top:0">Lass dich benachrichtigen, wenn die Klappe abends offen bleibt oder der Stall offline ist.</p><button class="btn pri" id="pOn">🔔 Benachrichtigungen aktivieren</button>`;
    $('#pOn').onclick = async () => {
      try {
        const perm = await Notification.requestPermission(); if (perm !== 'granted') return toast('Benachrichtigungen wurden nicht erlaubt.');
        const { publicKey } = await (await fetch(FN + '/hs-push')).json();
        const s = sub || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publicKey) }));
        const j = s.toJSON();
        const { error } = await sb.from('hs_push_subs').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id }, { onConflict: 'endpoint' });
        if (error) throw error; toast('Aktiviert ✅'); paintPush();
      } catch (e) { err(e); }
    };
    return;
  }
  const prefs = row.prefs || {};
  box.innerHTML = PUSHCAT.map((c) => `<label class="chk"><input type="checkbox" data-k="${c.k}" ${prefs[c.k] !== false ? 'checked' : ''}><div><div>${c.t}</div>${c.d ? `<div class="small muted">${c.d}</div>` : ''}</div></label>`).join('') +
    `<div class="row" style="margin-top:10px"><button class="btn" id="pTest">Testnachricht</button><button class="btn bad" id="pOff">Auf diesem Gerät aus</button></div>`;
  box.querySelectorAll('[data-k]').forEach((c) => (c.onchange = async () => { prefs[c.dataset.k] = c.checked; const { error } = await sb.from('hs_push_subs').update({ prefs }).eq('id', row.id); if (error) err(error); }));
  $('#pTest').onclick = async () => { const { data: { session } } = await sb.auth.getSession(); const r = await fetch(FN + '/hs-push', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_KEY }, body: JSON.stringify({ test: true }) }); const j = await r.json(); toast(j.sent ? 'Testnachricht gesendet' : 'Nichts gesendet: ' + (j.error || '0 Geräte')); };
  $('#pOff').onclick = async () => { await sb.from('hs_push_subs').delete().eq('id', row.id); await sub.unsubscribe(); paintPush(); };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && member?.status === 'approved') { loadState(); } });
boot().catch(err);
</script>
</body>
</html>
