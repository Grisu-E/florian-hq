key = sb_publishable_bEARbfjx56Xq7oUg9GQESA_BILmK_Jm
; Geheimnis der Brücke – NICHT weitergeben (in der Datenbank liegt nur ein Hash davon)
bridge_secret = HIER_DAS_GEHEIMNIS_EINTRAGEN   ; steht in deiner lokalen stallwache.ini aus dem ZIP

[logo]
; IP-Adresse der LOGO! 8 – sobald vergeben hier eintragen
host = 192.168.0.50
port = 502
unit_id = 1
; wie oft die LOGO abgefragt wird (Sekunden)
abfrage_s = 2

; ─── Signale der LOGO (angepasst an dein Programm vom 20.11.) ───
; Schreibweise: I3, Q1, M5, V0.0, AI1   –  ein ! davor kehrt um (für Öffner-Kontakte, z. B. !I4)
; leer lassen = nicht vorhanden
; I1 = Taster öffnen, I2 = Taster schließen, I3 = Licht, Q2 = Licht
endschalter_oben  = I4
endschalter_unten = I5
; dein Programm hat EINEN Motorausgang Q1 für beide Richtungen
motor             = Q1
motor_auf         =
motor_zu          =
; optional: Merker, den dein Programm bei Störung setzt (z. B. Laufzeitüberwachung)
stoerung          =
; optional: Temperaturfühler an AI1 (Rohwert × Faktor + Offset = °C) – steuert auch die Tränke-Heizung;
; ohne Fühler nimmt der Pi die Außentemperatur vom Wetterdienst
temperatur        =
temperatur_faktor = 0.1
temperatur_offset = 0

; ─── Befehle aus der App: Impuls auf ein V-Bit (Netzwerkeingang NI in der LOGO) ───
befehl_auf = V0.0
befehl_zu  = V0.1
; Stallpflicht-Sperre: solange 1, darf die LOGO die Klappe nicht öffnen (Netzwerkeingang NI4)
befehl_sperre = V0.3
; Tränke-Heizung: Pi schaltet über NI5 (V0.4), Q4 = Heizplatte (Status zur Anzeige)
befehl_heizung = V0.4
heizung = Q4
impuls_ms  = 800
; so lange darf die Klappe für eine Fahrt brauchen, danach gibt es eine Fehlermeldung
fahrzeit_max_s = 60

[kamera]
; GENBOLT-Kamera am Stall: IP 192.168.179.11
; RTSP-Adresse hängt von der Kamera-App ab – am PC mit VLC testen (Medien → Netzwerkstream öffnen):
;   CamHi / GENBOLT:  rtsp://admin:PASSWORT@192.168.179.11:554/11      (Substream: /12)
;   iCSee / XMEye:    rtsp://192.168.179.11:554/user=admin&password=PASSWORT&channel=1&stream=1.sdp
;   CloudEdge:        rtsp://admin:PASSWORT@192.168.179.11:554/live/ch00_1
;   ONVIF-Standard:   rtsp://admin:PASSWORT@192.168.179.11:554/stream1
; Dual-Lens: zweites Objektiv oft /21 bzw. channel=2
cam0_name = Stall innen
cam0_url  = rtsp://admin:PASSWORT@192.168.179.11:554/11
cam1_name = Auslauf
cam1_url  =
; normales Bild alle X Minuten
bild_alle_min = 10
; im Live-Modus der App alle X Sekunden
live_alle_s = 3

[ziegen]
; Ziegentür mit RFID-Reader (ESP32 am Stall) – auf "yes" stellen, sobald Reader und Schloss da sind
aktiv = no
; V-Bit (Netzwerkeingang NI3 in der LOGO), das das Schloss entriegelt, solange es 1 ist
befehl = V0.2
; optional zur Anzeige: Ausgang des Schlosses und Türkontakt (Reed) an der LOGO
schloss = Q3
tuerkontakt = I6
; Alarm, wenn die Ziegentür länger offen steht (Minuten)
tuer_offen_alarm_min = 10
; Port und Kennwort, mit dem sich der ESP32 beim Pi meldet (gleiches Kennwort im ESP32-Sketch eintragen)
port = 8088
token = HIER_EIN_KENNWORT_EINTRAGEN   ; gleiches Kennwort im ESP32-Sketch
